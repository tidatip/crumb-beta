  --focus:#55ADA2;--shadow:0 8px 24px rgba(31,61,58,.10);
  --hero-grad:linear-gradient(180deg,rgba(31,61,58,0) 30%,rgba(31,61,58,.75) 100%);
  --cover-fallback:#A6D8CE;--cover-sm:#DFF1EC;--cover-ink:#1F3D3A;
}
:root[data-palette=pastel]{
  --bg:#FCF3E8;--surface:#FFFCF8;--surface-2:#FFE8DE;--line:#F0DDD0;
  --ink:#4A3A34;--ink-2:#7A6259;--muted:#B29C93;
  --accent:#7FCDB8;--accent-2:#D2F0E2;--accent-soft:#D9F2E6;--accent-ink:#2B4A42;
  --leaf:#E48F86;--leaf-soft:#FFE0EC;--gold:#C9A227;--gold-soft:#FFF6CC;--pine:#6FBFA6;--pine-soft:#DFF6EB;
  --focus:#8FD7C4;--shadow:0 8px 24px rgba(74,58,52,.08);
  --hero-grad:linear-gradient(180deg,rgba(74,58,52,0) 30%,rgba(74,58,52,.7) 100%);
  --cover-fallback:#D2F0E2;--cover-sm:#FFEDE5;--cover-ink:#4A3A34;
}
:root[data-theme=dark]{
  --bg:#221C17;--surface:#2C2520;--surface-2:#3A3129;--line:#4A3F36;
  --ink:#F4EBDD;--ink-2:#CDBFAE;--muted:#8F8272;
  --accent:#E8C89A;--accent-2:#C8A46B;--accent-soft:#4A3B2A;--accent-ink:#221C17;--cover-fallback:#4A3B2A;--cover-sm:#2C2520;--cover-ink:#F4EBDD;
  --leaf:#E0876F;--leaf-soft:#4A2E26;--gold:#E2B55B;--gold-soft:#3D3220;--pine:#A3BF8E;--pine-soft:#2F3A28;
  --focus:#E8C89A;--shadow:0 8px 24px rgba(0,0,0,.45);
}
:root[data-theme=dark][data-palette=lavender]{--bg:#1E1A26;--surface:#2A2436;--surface-2:#362E45;--line:#453A57;--ink:#F0EAF8;--ink-2:#C3B6D8;--muted:#8C7DA3;--accent:#C3ADEB;--accent-2:#9B82CF;--accent-soft:#3A2E52;--accent-ink:#1E1A26;--cover-fallback:#3A2E52;--cover-sm:#2A2436;--cover-ink:#F0EAF8;--pine:#B7A0E8;--pine-soft:#33285C;--focus:#C3ADEB}
:root[data-theme=dark][data-palette=teal]{--bg:#0F1B1A;--surface:#172624;--surface-2:#20332F;--line:#2C433E;--ink:#E9F4F1;--ink-2:#B3CFC9;--muted:#6F9A93;--accent:#7ED5C7;--accent-2:#55ADA2;--accent-soft:#1E3F3A;--accent-ink:#0F1B1A;--cover-fallback:#1E3F3A;--cover-sm:#172624;--cover-ink:#E9F4F1;--pine:#7ED5C7;--pine-soft:#1E3F3A;--focus:#7ED5C7}
:root[data-theme=dark][data-palette=pastel]{--bg:#241E1C;--surface:#302826;--surface-2:#3C332F;--line:#4B403B;--ink:#F6ECE6;--ink-2:#D4C2B9;--muted:#9C8A82;--accent:#8FD7C4;--accent-2:#6FBFA6;--accent-soft:#2C4740;--accent-ink:#12211D;--cover-fallback:#2C4740;--cover-sm:#302826;--cover-ink:#F6ECE6;--pine:#8FD7C4;--pine-soft:#2C4740;--focus:#8FD7C4}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)!important;color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--accent)}
h1,h2,h3{margin:0;font-weight:500;line-height:1.25}
h1,.hero h2,.cover h2,.tcard h3{font-family:var(--fh);font-weight:var(--fhw,400);letter-spacing:var(--fhls,0)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
input.up{text-transform:uppercase}
input[type=date]{display:block;-webkit-appearance:none}
input[type=checkbox]{-webkit-appearance:checkbox;appearance:checkbox}
textarea{min-height:70px;resize:vertical;display:block;vertical-align:top}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 1px}
input.thin::placeholder{font-weight:300;font-size:13px}
.app{max-width:640px;margin:0 auto;padding:0 16px calc(84px + env(safe-area-inset-bottom))}
.screen{display:none;padding-top:calc(10px + env(safe-area-inset-top))}
.screen.on{display:block}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 2px 14px}
.head h1{font-size:28px;color:var(--accent)}
.head h1.greet{font-size:22px;line-height:1.2}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-bottom:12px}
.search svg{width:18px;height:18px;color:var(--muted)}
.search input{border:0;background:none;padding:0;height:36px}
.search{height:38px}
.seg.wide{height:38px;padding:2px}.seg.wide button{font-size:14px;padding:4px 4px}.seg.wide.four button{font-size:13px}
.head .sub{color:var(--muted);font-size:14px}
.head .tripsel{display:inline-flex;align-items:center;gap:4px;color:var(--ink-2);font-size:19px;font-weight:500;margin-top:2px}.head .tripsel svg{width:16px;height:16px;transform:rotate(90deg);color:var(--muted)}
.head.chead{align-items:flex-start}
.head.chead .cact{display:flex;gap:10px;align-items:center;margin-top:2px}
.head .logo{width:80px;height:80px;border-radius:18px;flex:0 0 auto;border:1px solid var(--line);object-fit:cover;background:var(--surface)}
.head .lead{display:flex;align-items:center;gap:12px}
.clock{text-align:right;font-variant-numeric:tabular-nums}
.clock b{display:block;font-size:22px;font-weight:600}
.clock span{font-size:12px;color:var(--muted)}
.ibtn{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:0 0 auto}
.ibtn.ghost{background:var(--surface-2);color:var(--ink)}
.ibtn svg{width:20px;height:20px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px}
.seg button{padding:6px 12px;border-radius:9px;font-size:13.5px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.wide{display:flex;margin-bottom:14px}.seg.wide button{flex:1}
.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:14.5px;background:var(--surface);border-radius:16px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px;font-weight:500}

/* trip cover card */
.cover{position:relative;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px;background:var(--cover-fallback);color:#fff;width:100%;text-align:left;display:block}
.cover{min-height:220px;display:flex;flex-direction:column;justify-content:flex-end}
.cover.pic{min-height:230px}
.cover .cam{cursor:pointer;position:absolute;z-index:3;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.7);color:#2A2622;display:grid;place-items:center;z-index:2}
.cover .cam svg{width:16px;height:16px}
.cover.pic .cam{background:rgba(42,38,34,.45);color:#fff}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cover .grad{display:none}
.cover.pic .grad{display:block;position:absolute;left:0;right:0;bottom:0;height:62%;background:rgba(42,38,34,.55)}
.cover:not(.pic){color:var(--cover-ink)}
.cover:not(.pic) h2{color:var(--cover-ink);text-shadow:none}
.cover:not(.pic) .pill{background:rgba(42,38,34,.09);color:var(--cover-ink)}
.cover .bot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:0;height:22px}
.cover .pill{margin-left:auto;background:rgba(42,38,34,.62);color:#fff;font-size:12.5px;padding:3px 10px;border-radius:999px;white-space:nowrap}
.cover .txt{position:relative;padding:16px 16px 12px 22px;width:100%;text-align:left;color:inherit;display:block}
.cover.pic .txt{padding-top:100px}
.cover h2{font-size:24px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.3);line-height:1.2}
.cover .dt{font-size:14px;opacity:.95;margin-top:2px;line-height:1.3}
.cover .meta{display:flex;gap:14px;align-items:center;font-size:12.5px;opacity:.95;margin-top:0;line-height:20px}
.cover .spend{font-size:12.5px;opacity:.9;line-height:22px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cover .meta svg{width:13px;height:13px;vertical-align:-2px;margin-right:3px}
.cover .cam svg{width:17px;height:17px}
.cover .cam input{display:none}
.cover.sm{min-height:120px}.cover.sm .cam{right:10px;top:10px;left:auto;width:28px;height:28px}.cover.sm .cam svg{width:14px;height:14px}.cover.sm h2{padding-right:34px}.cover.sm .dt{margin-top:2px}
.cover.sm.pic{min-height:115px}.cover.sm.pic .txt{padding-top:40px;padding-bottom:10px}.cover.sm h2{font-size:18px}.cover.sm .txt{padding:14px 16px 12px 22px}.cover.sm .pill{font-size:12px;padding:0 9px}
.tcard{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:10px;margin-bottom:8px;width:100%;text-align:left}
.tcard .th{width:76px;height:76px;border-radius:12px;background:var(--cover-fallback);overflow:hidden}
.tcard .th img{width:100%;height:100%;object-fit:cover;display:block}
.tcard h3{font-size:18px}
.tcard .st{font-size:13px;color:var(--muted);margin-top:2px}
.tcard .badge{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--cover-fallback);color:var(--cover-ink);display:inline-block;margin-top:4px}
.tcard svg{width:18px;height:18px;color:var(--muted)}

/* today */
.hero{background:var(--surface);border-radius:20px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px}
.hero{position:relative}.hero .hedit{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}.hero .hedit svg{width:14px;height:14px}
.hero .eyebrow{font-size:14px;color:var(--ink-2);margin-bottom:6px}
.hero h2{font-size:22px;margin-bottom:6px}
.hero .area{color:var(--muted);font-size:14px}
.hero .next{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero .next .lbl{font-size:13px;color:var(--muted)}
.hero .next .val{font-weight:500}
.hero .next .in{font-size:13px;color:var(--accent);font-weight:600;white-space:nowrap}
.daypick{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none}
.daypick::-webkit-scrollbar{display:none}
.daypick button{flex:0 0 auto;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.daypick button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.daypick button.today{border-color:var(--leaf);color:var(--leaf)}
.daypick button.on.today{background:var(--leaf);color:#fff}
.count{background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:12px 16px;margin-bottom:14px;font-size:15px}
.recap{font-size:14.5px;color:var(--ink-2);background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.recap b{color:var(--ink);font-weight:500}
.stayline{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink-2);margin:-6px 2px 14px}
.stayline svg{width:16px;height:16px;flex:0 0 auto}

/* trail */
.trail{position:relative;list-style:none;margin:0;padding:0}
.stop{display:grid;grid-template-columns:52px 22px 1fr;gap:0 8px;align-items:start;position:relative}
.stop .t{font-size:13px;color:var(--muted);text-align:right;padding-top:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stop .rail{position:relative;height:100%;display:flex;justify-content:center}
.stop .rail:before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.stop.first .rail:before{top:22px}.stop.last .rail:before{bottom:calc(100% - 22px)}
.stop .dot{position:relative;z-index:1;margin-top:18px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.stop.done .dot{background:var(--muted);border-color:var(--muted);width:8px;height:8px;margin-top:19px}
.stop.done .rail:before{background:var(--muted)}
.stop.now .dot{width:22px;height:22px;margin-top:12px;border:0;background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.stop.now .dot:after{content:"";position:absolute;inset:6px;border-radius:50%;background:#fff;opacity:.9}
.stop .card{background:var(--surface);border-radius:14px;padding:12px 12px 12px 14px;margin:6px 0;border:1px solid transparent;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.stop.now .card{border-color:var(--accent-2);box-shadow:var(--shadow)}
.stop.done .card{opacity:1}
.stop .ttl{font-weight:500;font-size:15.5px;display:flex;gap:8px;align-items:flex-start}
.stop .ttl .ico{flex:0 0 auto;width:18px;height:18px;margin-top:2px;color:var(--ink-2)}
.stop .d{font-size:14px;color:var(--ink-2);margin-top:4px}
.stop .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.tag.cost{background:var(--gold-soft);color:var(--gold)}.tag.cash{background:var(--leaf-soft);color:var(--leaf)}
.tag.ref{background:var(--pine-soft);color:var(--pine)}.bklink{display:flex;align-items:flex-start;gap:6px;margin-top:6px;padding:0;border:0;background:none;font:inherit;font-size:13px;line-height:1.4;color:var(--ink-2);text-align:left;cursor:pointer}.bklink svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--muted)}.bkhint{display:flex;align-items:center;gap:6px;margin-top:6px}.bkhint svg{width:14px;height:14px;flex:none;color:var(--pine)}.bkhint b{font-weight:500;color:var(--ink-2)}.tag.res{background:var(--accent-soft);color:var(--accent)}.tag.hard{background:var(--leaf);color:#fff}
.stop .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.stop .acts a,.stop .acts button{font-size:13px;padding:6px 10px;border-radius:9px;background:var(--surface-2);color:var(--ink);text-decoration:none;display:inline-flex;gap:5px;align-items:center}
.stop .acts svg{width:14px;height:14px}
.circ{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:0 0 auto;margin-top:2px}
.circ svg{width:16px;height:16px}
.circ.on{background:var(--pine);border-color:var(--pine);color:#fff}
.addrow{display:flex;gap:8px;margin:10px 0 4px}
.addrow button{background:var(--surface-2);color:var(--accent);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.addrow svg{width:16px;height:16px}

/* journal */
.stop.skip .card{opacity:.42}
.stop.skip .dot{border-color:var(--line)}
.stop .card{touch-action:pan-y;transition:transform .18s;will-change:transform}
.stop .card.dragging{transition:none}
.stop .hist{font-size:12.5px;color:var(--muted);margin-top:6px}
.stop .card[data-sd]{cursor:pointer}
.stop .d.cl{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sdh{font-size:13px;color:var(--muted);margin-bottom:4px}
.sheet h2.sdttl{display:flex;gap:8px;align-items:flex-start;line-height:1.35}
.sdttl svg{width:20px;height:20px;flex:none;margin-top:4px;color:var(--ink-2)}
.sdd{white-space:pre-wrap;font-size:15px;line-height:1.6;color:var(--ink-2);margin-top:8px}
.sdsteps{margin:10px 0 0;padding:0;list-style:none;counter-reset:sd}
.sdsteps li{counter-increment:sd;position:relative;padding:0 0 10px 30px;font-size:15px;line-height:1.5;color:var(--ink-2)}
.sdsteps li::before{content:counter(sd);position:absolute;left:0;top:1px;width:20px;height:20px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);font-size:12px;display:grid;place-items:center}
.sdsteps li:not(:last-child)::after{content:'';position:absolute;left:10px;top:24px;bottom:2px;width:1px;background:var(--line)}
.strow{display:grid;grid-template-columns:24px 1fr 28px;gap:8px;align-items:start;margin-bottom:6px}
.stn{width:22px;height:22px;margin-top:11px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);font-size:12px;display:grid;place-items:center}
#f-steps.one .stn{background:none;color:var(--muted)}
.sheet textarea.stin{min-height:0;height:auto;resize:none;overflow:hidden;line-height:1.5;padding-top:9px;padding-bottom:9px;margin:0}
.stx{width:28px;height:28px;margin-top:8px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:none;border:0}
.stx svg{width:14px;height:14px}
.stadd{display:flex;align-items:center;gap:6px;padding:4px 0;margin:2px 0 0 32px;border:0;background:none;font:inherit;font-size:14px;color:var(--ink-2)}
.stadd svg{width:16px;height:16px}
.sdtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sdsec{font-size:13px;color:var(--muted);margin:16px 0 8px;font-weight:500}
.sdpics{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.sdpics::-webkit-scrollbar{display:none}
.sdpics button{flex:0 0 84%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;scroll-snap-align:center;background:var(--surface-2);padding:0;border:0}
.sdpics button:only-child{flex-basis:100%}
.sdpics img{width:100%;height:100%;object-fit:cover;display:block}
.sheet .btns a.btn{display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.sheet .btns .btn svg{width:16px;height:16px}
.stop .shots{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.stop .shots button{width:64px;height:64px;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.stop .shots img{width:100%;height:100%;object-fit:cover;display:block}
.stop .jn{font-size:14px;color:var(--ink-2);margin-top:8px;padding:8px 10px;background:var(--surface-2);border-radius:10px;white-space:pre-wrap}
.stop .acts .lab{font-size:13px;padding:6px 10px;border-radius:9px;background:var(--surface-2);color:var(--ink);display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.stop .acts .lab svg{width:14px;height:14px}
.viewer img{width:100%;border-radius:14px;display:block}
/* journal sheet */
.jshots{display:flex;flex-wrap:wrap;gap:8px}
.jshot{position:relative;width:76px;height:76px;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.jshot img{width:100%;height:100%;object-fit:cover;display:block}
.jshot .jx{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(42,38,34,.7);color:#fff;display:grid;place-items:center}
.jshot .jx svg{width:12px;height:12px}
.jadd{width:100%;height:38px;margin-top:8px;border-radius:10px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;color:var(--accent);cursor:pointer}
.jadd svg{width:16px;height:16px}
.jshots:empty+.jadd{margin-top:0}
/* sections & notes */
.sec{margin:20px 0 10px}
.sec h3{font-size:17px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec h3>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec h3 .back{white-space:nowrap;flex:0 0 auto}
.note{background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.note h4{margin:0 0 6px;font-size:15px;font-weight:500}
.note p{margin:0;font-size:14px;color:var(--ink-2)}
.note ul{margin:0;padding-left:18px;font-size:14px;color:var(--ink-2)}.note li{margin:3px 0}
.rows{display:grid;gap:8px}.rows div{font-size:14px}.rows b{display:block;font-weight:500;color:var(--ink)}.rows span{color:var(--ink-2)}
.flight{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:8px;font-size:14px}
.flight{width:100%;text-align:left}.flight b{display:block;font-size:20px;font-weight:600}.flight .mid{color:var(--muted);font-size:12px;text-align:center;line-height:1.3}.flight .mid svg{width:18px;height:18px;color:var(--ink-2)}.flight .r{text-align:right}.flight small{color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--ink-2);font-size:14px;margin-bottom:8px}
.back svg{width:16px;height:16px}
.dayrow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:8px;width:100%;text-align:left}
.dayrow .n{font-size:22px;font-weight:600;color:var(--accent);line-height:1}
.dayrow .n small{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}
.dayrow .ti{font-weight:500;font-size:15px}.dayrow .st{font-size:13px;color:var(--muted);margin-top:2px}
.dayrow svg{width:18px;height:18px;color:var(--muted)}
.dayrow.today{border:1px solid var(--accent-2)}

/* checklist */
.dl{background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
.dl .rbox{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);margin-top:2px;display:grid;place-items:center;color:transparent}
.dl .rbox svg{width:14px;height:14px}
.dl.on .rbox{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dl .ti{font-weight:500;font-size:15px}.dl.on .ti{color:var(--muted)}
.dl .no{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.dl .when{font-size:13px;margin-top:6px;display:inline-block;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.dl .when.soon{background:var(--leaf-soft);color:var(--leaf)}.dl .when.past{background:var(--surface-2);color:var(--muted)}.dl .when.ok{background:var(--pine-soft);color:var(--pine)}
.dl{grid-template-columns:auto 1fr;cursor:pointer;touch-action:pan-y;transition:transform .18s}
.dl.dragging{transition:none}
.dl .rbox.sel{border-style:dashed}
.dl.selmode:not(.selected) .rbox{background:none;border-color:var(--muted);color:transparent;border-style:dashed}
.dl.selected .rbox.sel{background:var(--leaf);border-color:var(--leaf);color:#fff;border-style:solid}
.selbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));padding:8px 16px;z-index:9}
.selbar .btn{width:100%;max-width:608px;margin:0 auto;display:block}
.selbar .btn:disabled{opacity:.5}

/* settings */
.set{background:var(--surface);border-radius:14px;padding:4px 14px;margin-bottom:12px}
.set .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set .row:last-child{border:0}.set .row .l{font-size:15px}.set .row .h{font-size:13px;color:var(--muted);margin-top:2px}
.set .row select,.set .row input{width:auto;max-width:60%}
.danger{color:var(--leaf)}
.hint{font-size:13px;color:var(--muted);padding:0 4px}

/* calendar */
.rangebtn{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-height:44px;display:flex;justify-content:space-between;align-items:center}
.rangebtn span{color:var(--muted);font-size:13px}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 10px 6px;margin-top:8px}
.cal .mh{display:flex;justify-content:space-between;align-items:center;padding:0 4px 6px}
.cal .mh b{font-weight:500}
.cal .mh button{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.cal .mh svg{width:16px;height:16px}
.cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0}
.cal .g div{font-size:11px;color:var(--muted);text-align:center;padding:4px 0}
.cal .g button{height:38px;border-radius:0;font-size:14px;position:relative}
.cal .g button.o{color:var(--muted);opacity:.5}
.cal .g button.in{background:var(--accent-soft)}
.cal .g button.s,.cal .g button.e{background:var(--accent);color:var(--accent-ink);border-radius:999px}
.cal .g button.s.in{border-radius:999px 0 0 999px}.cal .g button.e.in{border-radius:0 999px 999px 0}
.cal .g button.s.e{border-radius:999px}
.cal .g button.today:after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;border-radius:50%;background:currentColor;transform:translateX(-50%)}
.cal .hint{text-align:center;padding:6px 0 2px}
/* profile */
.pcard{display:flex;gap:16px;align-items:flex-start;padding:6px 2px 14px}
.avatar.big{width:112px;height:112px}
.avatar.big .ed{width:30px;height:30px;right:2px;bottom:2px}.avatar.big .ed svg{width:14px;height:14px}
.pinfo{flex:1;min-width:0}
.pinfo h2{font-size:24px;margin-top:4px}
.pinfo .tag{font-size:14px;color:var(--ink-2);margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tile{border-radius:12px;padding:10px 6px;text-align:center;background:var(--surface-2)}
.tile b{display:block;font-size:20px;font-weight:600;line-height:1.1}
.tile span{font-size:12px;color:var(--ink-2)}
.tile .ti{display:block;margin:0 auto 4px;width:20px;height:20px;color:var(--ink-2)}.tile .ti svg{width:20px;height:20px}
.tile.t1{background:var(--accent-soft)}.tile.t2{background:var(--pine-soft)}.tile.t3{background:var(--leaf-soft)}
.tiles.wide .tile{padding:12px 6px}
.plist{padding:0 8px}
.prow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line)}
.prow:last-child{border:0}
.prow .pi{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);flex:0 0 auto}.prow .pi svg{width:18px;height:18px}
.prow .pl{flex:1;font-size:15px}
.prow .pv{font-size:13px;color:var(--muted)}
.prow>svg{width:16px;height:16px;color:var(--muted);flex:0 0 auto}
.prow[disabled]{opacity:.55}
.dots{display:inline-flex;gap:6px;margin-right:4px}.dots i{width:18px;height:18px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.06)}
/* money field */
.money{position:relative}.money input{padding-right:56px}.money .cur{position:absolute;right:10px;top:0;height:38px;line-height:38px;font-size:13px;color:var(--muted);font-weight:500}
/* switch */
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:44px;margin-top:10px;cursor:pointer}
.sw .l{font-size:15px}
.sw .h{font-size:12px;color:var(--muted);margin-top:1px}
.sw input{display:none}
.sw .knob{position:relative;width:46px;height:26px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);transition:.18s;flex:0 0 auto}
.sw .knob:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.18s}
.sw input:checked+.knob{background:var(--accent);border-color:var(--accent)}
.sw input:checked+.knob:after{left:22px;background:var(--accent-ink)}
.sw.tall{height:auto;padding:10px 12px}
/* off-we-go button */
.gobtn{width:100%;height:44px;margin-top:16px;border-radius:12px;border:1.5px solid var(--accent);color:var(--accent);font-weight:500;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.gobtn svg{width:16px;height:16px;display:none}
.gobtn.on{background:var(--accent);color:var(--accent-ink)}
.gobtn.on svg{display:block}
/* sheet (modal form) */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:none}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));z-index:31;transform:translateY(100%);transition:transform .22s;max-width:640px;margin:0 auto}
.sheet.on{transform:none}
.sheet .bar{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet h2{font-size:20px;margin-bottom:6px}
.sheet .btns{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:12px;background:var(--surface-2);color:var(--ink);font-weight:500;text-align:center}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.del{background:var(--leaf-soft);color:var(--leaf);flex:0 0 auto;padding:12px 14px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.photo{display:flex;gap:12px;align-items:center}
.photo .pv{width:88px;height:64px;border-radius:10px;background:var(--cover-fallback);overflow:hidden;flex:0 0 auto}
.photo .pv img{width:100%;height:100%;object-fit:cover;display:block}
.photo label.up{display:inline-block;background:var(--surface-2);padding:9px 12px;border-radius:10px;font-size:14px;color:var(--accent);font-weight:500;cursor:pointer}
.photo input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
input.fh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;display:inline-flex;gap:5px;align-items:center;color:var(--ink-2)}
.chips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chips.grid2c{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.chips.grid2c button{min-width:0;width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:8px 12px;border-radius:12px;text-align:left;min-height:38px;justify-content:center}
.chips.grid2c button b{font-weight:500;font-size:14px}
.chips.grid2c button small{font-size:12px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;display:block}
.chips button.more{padding:6px 14px;font-weight:600;letter-spacing:1px}
.chips svg{width:14px;height:14px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:10px}.chk input{width:18px;height:18px;padding:0}

/* start */
.start{position:fixed;inset:0;z-index:50;background:#FEFCF4;display:none}
.start.on{display:block}
.start .box{position:absolute;inset:0}
.start img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;object-position:center;mix-blend-mode:multiply}
:root[data-theme=dark] .start img{mix-blend-mode:normal;opacity:1}
.start .go{position:absolute;left:50%;top:60.6%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--fb);font-weight:500;font-size:16px;padding:12px 34px;border-radius:999px;box-shadow:0 8px 22px rgba(0,0,0,.22);white-space:nowrap}
body.starting .nav{display:none}
.avatar{width:80px;height:80px;border-radius:50%;position:relative;flex:0 0 auto;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%;border:1px solid var(--line);background:var(--surface-2)}
.avatar .ed{position:absolute;right:-2px;bottom:-2px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:2px solid var(--surface)}
.avatar .ed svg{width:13px;height:13px}
.prof{display:flex;gap:14px;align-items:center;background:var(--surface);border-radius:16px;padding:14px;margin-bottom:12px}
.prof input{flex:1}
/* pinned live card */
.cover.pin{margin-bottom:14px}
.cover .live{position:relative;margin:4px 20px 12px;padding-top:4px;border-top:1px solid rgba(42,38,34,.14)}
.cover.pic .live{border-top-color:rgba(255,255,255,.35)}
.cover .live .ld{font-size:13px;opacity:.85;line-height:20px}
.cover .live .ln{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:0}
.cover .live .ln .lbl{display:block;font-size:12px;opacity:.75;line-height:16px}
.cover .live .ln b{font-weight:500;font-size:15px;display:block;line-height:20px}
.cover .live .ln .in{font-size:13px;font-weight:600;white-space:nowrap}
.cover.pin .txt{padding-bottom:0!important}
/* small cards */
.cover.sm{min-height:0;background:var(--cover-sm);box-shadow:none;border:1px solid var(--line)}
.cover.sm.pic{min-height:115px}
.cover.sm .cam{background:var(--surface)}
/* inputs 38px */
input:not([type=checkbox]):not([type=file]),select,.rangebtn,.set .row select,.set .row input{height:38px;padding-top:0;padding-bottom:0;line-height:36px}
textarea{min-height:76px}
.rangebtn{min-height:38px}
.prof input{height:38px}
.pals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pals .pal{border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px;font-size:14px;background:var(--surface)}
.pals .pal.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sw3{display:inline-flex;flex:0 0 auto}
.sw3 i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.08);margin-left:-4px}
.sw3 i:first-child{margin-left:0}
.cover.full .spend{white-space:normal;line-height:1.35}.cover.full .bot{height:auto;align-items:flex-end}
/* card alignment lock — keep last */
.cover .txt,.cover.sm .txt,.cover.pic .txt,.cover.sm.pic .txt{padding-left:20px;padding-right:20px;padding-bottom:12px}
.cover .cam,.cover.sm .cam{top:12px;right:12px;width:32px;height:32px}.cover.sm .cam svg{width:16px;height:16px}
.cover .txt{padding-top:16px}.cover.sm .txt{padding-top:14px}.cover.pic .txt{padding-top:100px}.cover.sm.pic .txt{padding-top:40px}
#bgfix{position:fixed;inset:0;background:var(--bg);z-index:-1}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:10}
.nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:4px 0}
.nav button svg{width:22px;height:22px}.nav button.on{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);background:var(--accent);color:var(--accent-ink);padding:9px 14px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:40;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){.toast,.sheet{transition:none}}

/* v3.3 wizard */
.wzhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wzhead h2{margin:0}
.wzdots{display:flex;gap:5px}
.wzdots i{width:22px;height:5px;border-radius:3px;background:var(--line)}
.wzdots i.on{background:var(--accent)}
.wzq{font-family:var(--fh);font-weight:var(--fhw,400);font-size:24px;margin:14px 0 2px;color:var(--ink)}
.wzs{padding:0;margin-bottom:6px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px}
.stepper{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:2px;height:44px}
.stepper button{width:34px;height:38px;border-radius:10px;font-size:20px;color:var(--ink-2);line-height:1}
.stepper b{min-width:30px;text-align:center;font-weight:600;font-size:16px;line-height:1.05;display:flex;flex-direction:column;align-items:center}
.stepper b small{font-size:10.5px;font-weight:400;color:var(--muted)}
.stepper.big{width:max-content}
.stepper.big b{min-width:44px}
.wzstrip{display:flex;gap:3px;height:30px;margin:12px 0 3px;border-radius:10px;overflow:hidden}
.wzseg{display:flex;align-items:center;justify-content:center;min-width:0;color:#fff;font-size:12px;font-weight:500;padding:0 6px}
.wzseg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wzseg.empty{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--surface) 6px 12px);border:1px dashed var(--line)}
.wzticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);padding:0 1px;margin-bottom:8px}
.wzstat{display:flex;align-items:center;justify-content:space-between;gap:8px;border-radius:12px;padding:8px 12px;font-size:13.5px;margin-bottom:10px}
.wzstat.ok{background:var(--pine-soft);color:var(--pine);justify-content:flex-start}
.wzstat.ok svg{width:16px;height:16px}
.wzstat.warn{background:var(--gold-soft);color:var(--gold)}
.wzstat.warn button{font-size:13px;font-weight:500;color:var(--gold);border:1px solid currentColor;border-radius:999px;padding:3px 10px}
.wzstay{display:grid;grid-template-columns:8px 1fr auto 24px;gap:8px;align-items:center;background:var(--surface);border-radius:14px;padding:10px 8px 10px 10px;margin-bottom:8px}
.wzdot{width:8px;align-self:stretch;border-radius:4px}
.wzin{display:flex;flex-direction:column;gap:6px;min-width:0}
.wzin input{height:36px;padding:6px 10px;font-size:14px}
.wzin input.w-stay{font-size:13px}
.wzstay .stepper{height:auto;flex-direction:column;padding:2px 1px;gap:0}
.wzstay .stepper button{width:34px;height:26px;font-size:17px}
.wzrm{color:var(--muted);display:flex;justify-content:center}
.wzrm svg{width:16px;height:16px}
.wzadd{margin:4px 0 0 4px}
.wzleg{background:var(--surface);border-radius:14px;padding:10px 12px 12px;margin-top:14px}
.wzleg-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.wzleg-h b{font-weight:600;font-size:15px}
.wzleg-h span{font-size:12.5px;color:var(--muted)}
.wzleg .chips button{padding:5px 9px;font-size:12.5px}
.wzleg label.f{margin-top:8px}
#w-cur button{min-width:52px;justify-content:center}
.wzprev{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.wzday{display:grid;grid-template-columns:44px 1fr;gap:10px;background:var(--surface);border-radius:14px;padding:10px 12px}
.wzday .n{font-size:20px;font-weight:600;color:var(--accent);line-height:1}
.wzday .n small{display:block;font-size:10.5px;color:var(--muted);font-weight:400;margin-top:3px}
.wzdb .ti{font-weight:500;font-size:14.5px}
.wzdb .ar{font-size:12.5px;color:var(--ink-2);margin-top:1px}
.wzdb .st{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;gap:4px;align-items:center}
.wzdb .st svg,.wzits svg{width:13px;height:13px;flex:0 0 auto}
.wzits{display:flex;flex-direction:column;gap:2px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.wzits span{display:flex;gap:5px;align-items:center;font-size:12px;color:var(--ink-2)}
.sw .l small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:1px}
.wzlinks{display:flex;justify-content:center;gap:18px;margin-top:14px}
.wzlinks button{font-size:13.5px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
/* idea bag */
.ibag{display:block;width:100%;text-align:left;background:var(--surface);border-radius:16px;padding:12px 14px;border:1.5px dashed var(--accent-2)}
.ibag.emp{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--ink-2);line-height:1.45}
.ibico{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}
.ibico svg{width:18px;height:18px}
.ibtop{display:flex;align-items:baseline;gap:8px}
.ibtop b{font-size:26px;font-weight:600;color:var(--accent);line-height:1}
.ibtop span{flex:1;font-size:14px;color:var(--ink-2)}
.ibtop svg{width:18px;height:18px;color:var(--muted);align-self:center}
.ibareas{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

.igrp{margin-top:14px}
.igh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 2px 6px}

.icard{display:grid;grid-template-columns:34px 1fr;gap:10px;background:var(--surface);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer}

.iplace svg{width:15px;height:15px}
.pidea{display:flex;align-items:center;gap:8px;background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin:6px 0 2px;font-size:14.5px}

#w-cur,.wzleg .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px 2px}

.ilinkrow{display:flex;justify-content:flex-end;margin:-4px 0 6px}

/* v3.4 palette: bright */
:root[data-palette=bright]{
  --bg:#FFF1D6;--surface:#FFFBF1;--surface-2:#FFE7BE;--line:#F2DDB5;
  --ink:#1F2547;--ink-2:#4B5078;--muted:#9095B0;
  --accent:#58A6FF;--accent-2:#F8769C;--accent-soft:#DEEDFF;--accent-ink:#10254A;
  --leaf:#EE6158;--leaf-soft:#FFE0DC;--gold:#6B5800;--gold-soft:#FBE449;--pine:#8E93CB;--pine-soft:#E4E5F5;
  --focus:#8FC3FF;--shadow:0 8px 24px rgba(31,37,71,.08);
  --hero-grad:linear-gradient(180deg,rgba(31,37,71,0) 30%,rgba(31,37,71,.72) 100%);
  --cover-fallback:#58A6FF;--cover-sm:#FFE7BE;--cover-ink:#1F2547;
}
:root[data-theme=dark][data-palette=bright]{--bg:#141A2E;--surface:#1C2340;--surface-2:#262E50;--line:#333C62;--ink:#F2F4FB;--ink-2:#C3C8E2;--muted:#8288AC;--accent:#7DB9FF;--accent-2:#FF8FB0;--accent-soft:#1E3560;--accent-ink:#0E1726;--cover-fallback:#1E3560;--cover-sm:#1C2340;--cover-ink:#F2F4FB;--pine:#A9ADE0;--pine-soft:#2E3160;--gold:#141A2E;--gold-soft:#E8D23F;--leaf:#FF7D74;--leaf-soft:#4A2530;--focus:#7DB9FF}

/* v3.4 palette: sunny */
:root[data-palette=sunny]{
  --bg:#FFF6C7;--surface:#FFFDF2;--surface-2:#F5EBC4;--line:#E8D9A7;
  --ink:#3A2E12;--ink-2:#6B5A2E;--muted:#A3916A;
  --accent:#D4A017;--accent-2:#FFD54F;--accent-soft:#FFEFA6;--accent-ink:#3A2E12;
  --leaf:#B06A00;--leaf-soft:#FFE0A8;--gold:#6B5200;--gold-soft:#FFE785;--pine:#8C6A0A;--pine-soft:#F3E8BE;
  --focus:#FFD54F;--shadow:0 8px 24px rgba(58,46,18,.08);
  --hero-grad:linear-gradient(180deg,rgba(58,46,18,0) 30%,rgba(58,46,18,.7) 100%);
  --cover-fallback:#FFD54F;--cover-sm:#E8D9A7;--cover-ink:#3A2E12;
}
:root[data-palette=sunny] :is(.ibtn,.daypick button.on,.dl.on .rbox,.cal .g button.s,.cal .g button.e,.gobtn.on,.btn.pri,.chips button.on,.avatar .ed,.wzdots i.on,.iplace){background:#FBE449;color:#3A2E12}
:root[data-theme=dark][data-palette=sunny]{--bg:#1E1A10;--surface:#2A2416;--surface-2:#362E1C;--line:#463C26;--ink:#FFF6D6;--ink-2:#E0D2A6;--muted:#A8976A;--accent:#FBE449;--accent-2:#FFD54F;--accent-soft:#3D3416;--accent-ink:#1E1A10;--cover-fallback:#5A4A1A;--cover-sm:#2A2416;--cover-ink:#FFF6D6;--pine:#FFD54F;--pine-soft:#3D3416;--gold:#1E1A10;--gold-soft:#FFE785;--leaf:#FFB54F;--leaf-soft:#4A3515;--focus:#FFD54F}

/* v3.5 step drag */
#f-steps:not(.one) .stn{touch-action:none;cursor:grab;position:relative;user-select:none;-webkit-user-select:none}
#f-steps:not(.one) .stn::after{content:'';position:absolute;left:50%;top:calc(100% + 4px);width:10px;height:2px;border-radius:2px;background:var(--line);transform:translateX(-50%);box-shadow:0 3px 0 var(--line)}
#f-steps.dragging .stn{cursor:grabbing}
#f-steps.dragging{user-select:none;-webkit-user-select:none}
.strow.drag{position:relative;z-index:5;background:var(--bg);border-radius:14px;box-shadow:0 10px 24px rgba(0,0,0,.14)}
.strow.drag .stn{background:var(--accent);color:var(--accent-ink)}

/* v3.6 costs */
.costcard{display:block;width:100%;text-align:left;background:var(--surface);border-radius:16px;padding:14px}
.costcard.emp{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--ink-2);border:1.5px dashed var(--line);line-height:1.45}
.ctop{display:flex;align-items:center;gap:10px}
.cnum b{font-family:var(--fh);font-weight:var(--fhw,400);font-size:26px;line-height:1}
.cnum span{font-size:12.5px;color:var(--muted);margin-left:5px}
.cpp{margin-left:auto;font-size:13px;background:var(--accent-soft);color:var(--ink-2);border-radius:999px;padding:4px 10px}
.ctop>svg{width:18px;height:18px;color:var(--muted)}
.cbar{display:flex;gap:3px;height:8px;margin:12px 0 10px;border-radius:5px;overflow:hidden}
.cbar i{display:block;min-width:3px}
.crows{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.crow{display:flex;align-items:center;gap:7px;font-size:13px}
.cdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.crow .cl{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow b{margin-left:auto;font-weight:500}
.cpaid{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}
.cpbar{flex:1;height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.cpbar i{display:block;height:100%;background:var(--pine)}
.cpaid span{font-size:12px;color:var(--muted);flex:0 0 auto}
.ecard{display:flex;width:100%;text-align:left;gap:10px;align-items:center;background:var(--surface);border-radius:14px;padding:12px;margin-bottom:8px}
.ecard .eb{min-width:0;flex:1}
.ecard .ttl{font-weight:500;font-size:14.5px}
.ecard .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.ecard .ev{text-align:right;flex:0 0 auto}
.ecard .ev b{font-weight:600;font-size:15px}
.ecard .ev span{display:block;font-size:11.5px;color:var(--muted)}
.mopt{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chips.sm button{padding:5px 11px;font-size:12.5px}
.staycard{display:flex;width:100%;text-align:left;gap:10px;align-items:flex-start}
.staycard .sv{margin-left:auto;font-size:13px;font-weight:600;flex:0 0 auto}

.spend.tap{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.14);border:0;border-radius:999px;padding:3px 8px 3px 10px;font:inherit;color:inherit}
.spend.tap svg{width:14px;height:14px;opacity:.8}
.ppnote{margin-top:16px;text-align:center}

.chead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 4px}
.chead .ih1{margin:0}
.ctot{display:flex;align-items:baseline;gap:5px;justify-content:flex-end;text-align:right}
.ctot b{font-family:var(--fh);font-weight:var(--fhw,400);font-size:30px;line-height:1}
.ctot span{font-size:13px;color:var(--muted)}
.cpd{font-size:12.5px;color:var(--pine);margin:0 0 10px;text-align:right}
.cswitch{margin-bottom:10px}
.cover .bot .spend.tap{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;flex:0 0 auto}
.bot .spend.tap{font-size:13.5px}

.crate{display:flex;width:100%;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border-radius:12px;padding:9px 12px;margin:0 0 12px;font-size:12.5px;color:var(--muted);text-align:left}
.crate span{flex:0 0 auto;color:var(--accent);font-weight:500}

.ecard.un .ev b{color:var(--muted);font-weight:500}
.ecard.un .ttl{color:var(--ink-2)}
.ecard.pd .ev b{display:inline-flex;align-items:center;gap:4px;justify-content:flex-end}
.ecard.pd .ev b svg{width:14px;height:14px;color:var(--pine)}
.cfil{margin-top:-4px}
.cpd{display:block}

.cseg{display:flex;width:100%;border-radius:12px;margin-bottom:8px}
.cseg button{flex:1 1 0;min-width:0;border-radius:10px;padding:8px 6px;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cseg+.cseg{margin-top:-2px}

.csegbox{background:var(--surface-2);border-radius:11px;padding:2px;margin:0 0 10px}
.csegbox .row{display:flex;gap:2px}
.csegbox .row+.row{margin-top:2px;padding-top:2px;border-top:1px solid var(--line)}
.csegbox button{flex:1 1 0;min-width:0;padding:5px 4px;border-radius:9px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csegbox button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.csegbox.mbox{margin:8px 0 0}
.csegbox.mbox button{padding:6px 4px;line-height:1.15}
.csegbox.mbox button small{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
.csegbox.mbox button.on small{color:var(--ink-2)}

.csegbox.one{display:flex;gap:2px}
.csegbox.one .row{flex:1 1 0;min-width:0}
.csegbox.one .row+.row{margin:0 0 0 2px;padding:0 0 0 3px;border-top:0;border-left:1px solid var(--line)}
.csegbox.one button{font-size:12.5px}

/* v3.7 sheet height + drag handle */
.sheet{max-height:82vh}
@supports (max-height:82dvh){.sheet{max-height:82dvh}}
.sheet .bar{position:relative;touch-action:none;cursor:grab;width:48px;height:5px}
.sheet .bar::after{content:'';position:absolute;left:-60px;right:-60px;top:-14px;bottom:-14px}

/* v3.11 smaller tick + sticky sheet footer */
.stop .card{position:relative;grid-template-columns:1fr;gap:0}
.stop .card>div:first-child{padding-right:26px}
.stop .circ{position:absolute;top:6px;right:6px;width:36px;height:36px;border:0;background:none;padding:0;margin:0;display:grid;place-items:center}
.stop .circ::before{content:'';width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);box-sizing:border-box}
.stop .circ.on::before{background:var(--pine);border-color:var(--pine)}
.stop .circ svg{position:absolute;width:12px;height:12px}
.stop .circ.on{color:#fff}
.sheet{max-height:90vh}
@supports (max-height:90dvh){.sheet{max-height:90dvh}}
.sheet .btns{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));margin:16px -16px calc(-20px - env(safe-area-inset-bottom));padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);z-index:3}

/* v3.13 pinned day bar */
.daypick{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);margin:0 -16px 4px;padding:2px 18px 10px;transition:box-shadow .15s}
.daypick.stuck{box-shadow:0 1px 0 var(--line),0 8px 14px -10px rgba(0,0,0,.3)}
.sbcover{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:8;pointer-events:none}
/* v3.13 insert between stops */
.trail .ins{display:grid;grid-template-columns:52px 22px 1fr;gap:0 8px;height:14px;position:relative}
.trail .ins .rail{position:relative;display:flex;justify-content:center}
.trail .ins .rail:before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.trail .ins button{position:absolute;top:50%;left:50%;width:40px;height:40px;margin:-20px 0 0 -20px;padding:0;border:0;background:none;display:grid;place-items:center;z-index:2;color:var(--ink-2)}
.trail .ins button::before{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:var(--surface);border:1.5px solid var(--pine);box-sizing:border-box}
.trail .ins button svg{position:relative;width:12px;height:12px}
.trail .ins button:active::before{background:var(--accent);border-color:var(--accent)}
.trail .ins button:active{color:var(--accent-ink)}
.toast{max-width:calc(100vw - 32px);width:max-content;white-space:normal;text-align:center}
.sheet .insh{font-size:13px;color:var(--ink-2);background:var(--accent-soft);border-radius:10px;padding:8px 10px;margin:-2px 0 4px}
/* v3.13 drag to reorder stops (handle = time + dot) */
.stop .t,.stop .rail{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.stop[data-mv] .t,.stop[data-mv] .rail{cursor:grab}
.stop .dot{transition:transform .2s}
.stop.pressing .dot{transform:scale(1.5)}
.trail.dragging .ins{display:none}
.trail.dragging{touch-action:none}
.stop.lifted{z-index:6}
.stop.lifted .card{box-shadow:0 16px 32px rgba(0,0,0,.2);outline:2px solid var(--accent);transform:scale(1.02)}
.stop.lifted .rail:before{opacity:0}
.stop.lifted .dot{border-color:var(--accent);transform:scale(1.3)}
.stop.lifted .t{color:var(--accent);font-weight:600}

/* v3.16 plan from text */
#tp textarea.tpin{min-height:240px;font-size:14px;line-height:1.5;resize:vertical}
.tpai{margin-top:12px;background:var(--surface);border:1.5px dashed var(--accent-2);border-radius:14px;padding:11px 13px}
.tpai p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.5}
.tpai button{margin-top:8px;display:inline-flex;gap:6px;align-items:center;font-size:13.5px;font-weight:500;color:var(--accent);background:var(--surface-2);border-radius:10px;padding:7px 12px}
.tpai svg{width:15px;height:15px}
.tpsum{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:500;background:var(--accent-soft,var(--surface-2));color:var(--ink);border-radius:12px;padding:9px 12px;margin:2px 0 4px}
.tpsum svg{width:16px;height:16px;color:var(--accent)}
.tpdates{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:14.5px}
.tpdates small{display:block;font-size:12px;color:var(--muted)}
.tpinto{font-size:14px;color:var(--ink-2);margin:2px 0}
.tpinto b{color:var(--ink)}
.tpday{background:var(--surface);border-radius:16px;padding:12px 12px 6px;margin-top:10px}
.tpdh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.tpdh b{font-size:13px;color:var(--accent);font-weight:600}
.tpdh .nw{background:var(--accent-2);color:#fff;border-radius:999px;padding:0 8px;font-size:11.5px}
.tpdt{font-family:var(--fh);font-weight:500;font-size:17px;margin:2px 0 0;line-height:1.3}
.tpmeta{font-size:12.5px;color:var(--ink-2);margin-top:3px;display:flex;flex-direction:column;gap:2px}
.tpmeta span{display:flex;gap:5px;align-items:center}
.tpmeta svg{width:13px;height:13px;flex:0 0 auto}
.tpit{display:grid;grid-template-columns:44px 18px 1fr 30px;gap:6px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.tpdh+.tpit,.tpdt+.tpit,.tpmeta+.tpit{margin-top:8px}
.tpit .tm{font-size:12.5px;color:var(--muted);text-align:right;padding-top:1px;font-variant-numeric:tabular-nums}
.tpit .ico{width:16px;height:16px;margin-top:2px;color:var(--ink-2)}
.tpit b{display:block;font-weight:500;font-size:14px;line-height:1.35}
.tpit small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px;color:var(--ink-2);line-height:1.45;margin-top:1px}
.tpit .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.tpit .tag{font-size:11.5px}
.tpit .tpx{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.tpit .tpx svg{width:14px;height:14px}
.tpday .empty{font-size:12.5px;color:var(--muted);padding:6px 0 8px}
.tpskip{margin-top:12px;font-size:13px;color:var(--ink-2)}
.tpskip summary{cursor:pointer;color:var(--muted)}

/* beta: live sharing */

.lvlink .qr{width:118px;height:118px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden}
.lvlink .qr img{width:118px;height:118px;image-rendering:pixelated}
.lvlink code{display:block;font-size:12px;color:var(--ink-2);word-break:break-all;background:var(--surface-2);border-radius:8px;padding:6px 8px;font-family:inherit}
.lvlink .bb{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.lvlink .bb button{display:flex;gap:6px;align-items:center;justify-content:center;font-size:13.5px;font-weight:500;border-radius:10px;padding:8px;background:var(--surface-2);color:var(--ink)}
.lvlink .bb button.p{background:var(--accent);color:var(--accent-ink)}
.lvlink .bb svg{width:15px;height:15px}
.mem{display:flex;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
.mem:last-child{border-bottom:0}
.lvav{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;color:#fff;flex:0 0 auto}
.mem small{display:block;color:var(--muted);font-size:12px}
.lvacts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.lvacts button{text-align:left;font-size:14px;padding:10px 12px;border-radius:12px;background:var(--surface);display:flex;gap:8px;align-items:flex-start;color:var(--ink)}
.lvacts button small{display:block;color:var(--muted);font-size:12px}
.lvacts button.del{color:var(--leaf)}
.lvacts svg{width:16px;height:16px;margin-top:3px;flex:0 0 auto}
.lvpill{display:inline-flex;gap:6px;align-items:center;font-size:12px;border-radius:999px;padding:3px 10px;background:#DDF5E7;color:#1E6B43;white-space:nowrap}
.lvpill:before{content:'';width:7px;height:7px;border-radius:50%;background:#3CC37A}
.lvpill.off{background:#FFF0CF;color:#7A5300}.lvpill.off:before{background:#F2A900}
.lvpill.wait{background:var(--surface-2);color:var(--ink-2)}.lvpill.wait:before{background:var(--muted)}
.lvjoin{background:var(--surface);border-radius:18px;padding:14px 16px;margin-top:6px;box-shadow:var(--shadow)}
.lvjoin .who{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink-2)}
.lvjoin h3{font-family:var(--fh);font-weight:500;font-size:24px;margin:10px 0 2px}
.lvjoin .m{font-size:13px;color:var(--muted)}
.lvavs{display:flex}.lvavs .lvav{width:26px;height:26px;font-size:11.5px;border:2px solid var(--bg);margin-left:-7px}.lvavs .lvav:first-child{margin-left:0}
.lvcode{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:10px 12px 10px 16px;margin-top:10px}
.lvcode small{display:block;font-size:12px;color:var(--muted)}
.lvcode b{font-size:26px;font-weight:600;letter-spacing:4px;color:var(--ink);font-variant-numeric:tabular-nums}
.lvcode button{display:flex;gap:6px;align-items:center;font-size:13.5px;font-weight:500;border-radius:10px;padding:8px 12px;background:var(--surface-2);color:var(--ink)}
.lvcode button svg{width:15px;height:15px}
.lvcin{font-size:26px!important;letter-spacing:6px;text-align:center;text-transform:uppercase;font-weight:600;height:58px}
.lvpaste{display:flex;gap:6px;align-items:center;justify-content:center;width:100%;margin-top:10px;font-size:14px;font-weight:500;color:var(--accent);background:var(--surface-2);border-radius:12px;padding:10px}
.lvpaste svg{width:16px;height:16px}
.lvinapp{display:flex;flex-direction:column;gap:2px;background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-radius:16px;padding:12px 14px;margin-top:10px;font-size:13px;color:var(--ink-2);line-height:1.5}
.lvinapp b{color:var(--ink);font-size:14px;font-weight:600}
.lvinapp .lvcode{background:var(--surface)}
.lvjbtn{display:inline-flex;gap:4px;align-items:center;padding:0;background:none;color:var(--accent);font:inherit;font-weight:500;white-space:nowrap}
.lvjbtn svg{width:14px;height:14px}
.lvbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:-6px 0 10px;width:100%;background:none;padding:0;text-align:left}

#f-dtitle::placeholder{color:var(--muted);opacity:.75;font-style:italic}

/* v3.17 find ideas */
.fibtn{display:inline-flex;gap:5px;align-items:center}
.fibtn svg{width:15px;height:15px}
.sec h3 .hbtns{display:flex;gap:14px;flex:0 0 auto}
.fisec{background:var(--surface);border-radius:16px;padding:12px 14px;margin-top:12px}
.fisec h4{margin:0 0 2px;font-size:15px;font-weight:500;display:flex;gap:8px;align-items:center}
.fisec h4 i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12.5px;display:grid;place-items:center;flex:0 0 auto}
.fisec .hint{margin:0 0 8px}
.figrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.figrid a{display:flex;gap:8px;align-items:center;background:var(--surface-2);border-radius:12px;padding:10px;color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.3;min-width:0}
.figrid a svg{width:18px;height:18px;flex:0 0 auto;color:var(--accent)}
.figrid a small{display:block;color:var(--muted);font-size:11.5px}
.ficity{display:flex;gap:8px;align-items:center}
.ficity input{flex:1}
.fichips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.fichips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;color:var(--ink-2)}
.fichips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ficopy{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;font-weight:500;color:var(--accent);background:var(--surface-2);border-radius:10px;padding:8px 12px}
.ficopy svg{width:15px;height:15px}
#fi textarea.tpin{min-height:150px}
.tiarea{font-size:13px;font-weight:600;color:var(--accent);margin:12px 0 2px;display:flex;justify-content:space-between}
.tiarea span{color:var(--muted);font-weight:400}
.tirow{display:grid;grid-template-columns:20px 1fr 30px;gap:8px;align-items:start;background:var(--surface);border-radius:12px;padding:9px 6px 9px 10px;margin-top:6px}
.tirow .ico{width:17px;height:17px;margin-top:2px;color:var(--ink-2)}
.tirow b{display:block;font-weight:500;font-size:14px;line-height:1.35}
.tirow small{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.45;margin-top:1px}
.tirow .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.tirow .tag{font-size:11.5px}
.tirow.dup{opacity:.5}
.tirow .tpx{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.tirow .tpx svg{width:14px;height:14px}
.tpskip div{margin-top:6px;background:var(--surface);border-radius:12px;padding:8px 10px;white-space:pre-wrap;line-height:1.5;font-size:12.5px}
</style>
</head>

// ---- photo store (IndexedDB) ----
const DB={_p:null,open(){if(this._p)return this._p;this._p=new Promise((res,rej)=>{const r=indexedDB.open('crumb-beta',1);r.onupgradeneeded=()=>{r.result.createObjectStore('photos')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return this._p},
  put(id,v){return this.open().then(db=>new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(v,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)}))},
  get(id){return this.open().then(db=>new Promise((res,rej)=>{const r=db.transaction('photos').objectStore('photos').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  del(id){return this.open().then(db=>new Promise((res,rej)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)}))}};
function resize(file,max,q){return new Promise(res=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height;const r=Math.min(1,max/Math.max(w,h));w=Math.round(w*r);h=Math.round(h*r);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};img.src=url})}
async function addPhotos(tr,di,itemId,files){const it=tr.days[di].items.find(x=>x.id===itemId);it.photos=it.photos||[];for(const f of files){const id=uid();const [full,thumb]=await Promise.all([resize(f,1400,0.8),resize(f,240,0.7)]);await DB.put(id,{full,thumb,at:new Date().toISOString()});it.photos.push(id)}save();render();toast(t('saved'))}
function loadThumbs(){document.querySelectorAll('img[data-photo]').forEach(async el=>{const v=await DB.get(el.dataset.photo);if(v)el.src=v.thumb;else el.remove()})}

let S=load();S.simDate='';if(!S.finalv1){S.trips=S.trips.filter(x=>!x.sample);S.finalv1=true}if(!S.seedv5){S.trips.forEach(x=>{if(x.sample&&(x.id==='cnx2026'||x.id==='kyoto2025'))x.closed=true});S.seedv5=true}if(!S.day7v29)S.day7v29=true;if(!S.bk30)S.bk30=true;save();

const t=(k,v={})=>{let s=I[S.lang][k]??I.th[k]??k;if(typeof s!=='string')return s;return s.replace(/\{(\w+)\}/g,(_,x)=>v[x])};

function load(){
  let s={};try{s=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
  s=Object.assign({palette:'cream',avatar:'',simDate:'',q:'',tq:'',tripTab:'all',name:'',lang:'th',theme:'auto',simDate:'',view:'home',homeTab:'upcoming',tripId:null,dayView:null,checkTrip:null,trips:[]},s);

  let date=`${g('year')}-${g('month')}-${g('day')}`,h=+g('hour')%24,m=+g('minute');

}

const WZC=['var(--accent)','var(--pine)','var(--leaf)','var(--gold)','var(--accent-2)'];
function wzNew(){return {step:1,name:'',dest:'',start:'',end:'',members:2,stays:[{area:'',stay:'',n:0}],cur:'THB',rate:'',out:{mode:'fly',from:'',to:'',dep:'',arr:'',code:'',pre:false},back:{mode:'fly',from:'',to:'',dep:'',arr:'',code:''},stops:true}}
function outPre(O){const a=tmin(O.arr),d=tmin(O.dep);return a!=null&&d!=null&&a<d}
function wzNights(w){if(!w.start||!w.end)return 0;return Math.round((new Date(w.end+'T00:00:00')-new Date(w.start+'T00:00:00'))/864e5)}
function wzUsed(w){return w.stays.reduce((a,s)=>a+(+s.n||0),0)}
function isoAdd(a,n){const d=new Date(a+'T00:00:00');d.setDate(d.getDate()+n);return iso(d.getFullYear(),d.getMonth(),d.getDate())}
function dshort(v){if(!v)return '';const [,m,d]=v.split('-');return `${+d} ${t('mon')[+m-1]}`}
function wzRead(){const w=S.wiz;if(!w||!$('#wz'))return;const g=id=>$(id)?$(id).value.trim():null;
  if(w.step===1){w.name=g('#w-name');w.dest=g('#w-dest');w.start=$('#f-start').value;w.end=$('#f-end').value}
  if(w.step===2){document.querySelectorAll('.wzstay').forEach((r,i)=>{const s=w.stays[i];if(!s)return;s.area=r.querySelector('.w-area').value.trim();s.stay=r.querySelector('.w-stay').value.trim()})}
  if(w.step===3){w.rate=g('#w-rate')??w.rate;['out','back'].forEach(k=>{const L=w[k];L.mode=$(`#w-${k}-mode .on`)?.dataset.k||L.mode;['from','to','dep','arr','code'].forEach(f=>{const v=g(`#w-${k}-${f}`);if(v!=null)L[f]=f==='dep'||f==='arr'?v:v.toUpperCase()})})}
  if(w.step===4){w.stops=!!$('#w-stops')?.checked}
  save()}
function wzPlan(w){const n=wzNights(w),st=w.stays.filter(s=>s.area||s.stay||+s.n);const seg=[];st.forEach((s,k)=>{for(let j=0;j<(+s.n||0);j++)seg.push(k)});
  const days=[];const O=w.out,B=w.back,hasO=O.from||O.to,hasB=B.from||B.to;
  const tw=x=>S.lang==='th'?{am:'เช้า',pm:'บ่าย'}[x]:{am:'morning',pm:'afternoon'}[x];
  for(let i=0;i<=n;i++){const date=isoAdd(w.start,i),k=seg[i],pk=i>0?seg[i-1]:undefined,s=st[k],ps=st[pk];
    let area='',title='',stay=s?s.stay:'';const items=[];
    if(s&&ps&&k!==pk){area=`${ps.area} → ${s.area}`;title=t('wz_move',{a:s.area})}
    else if(s){area=s.area}
    else if(ps){area=hasB&&B.from?`${ps.area} → ${B.from}`:ps.area;title=t('wz_home')}
    if(i===0&&hasO&&s){title=t('wz_arrive',{a:s.area})}
    if(w.stops){
      if(i===0&&hasO)items.push({t:O.arr||'',title:t('wz_arr_stop',{p:O.to||s&&s.area||''}),d:[O.code,(!outPre(O)&&O.dep)?(S.lang==='th'?'ออก ':'Dep ')+O.dep:''].filter(Boolean).join(' · '),k:O.mode});
      if(ps&&k!==pk)items.push({t:tw('am'),title:t('wz_outs',{s:ps.stay||t('wz_stay_x')}),d:'',k:'stay'});
      if(s&&(i===0||k!==pk))items.push({t:(i===0&&hasO&&O.arr&&(tmin(O.arr)??0)>=780)?'':tw('pm'),title:t('wz_in',{s:s.stay||`${t('wz_stay_x')} · ${s.area}`}),d:'',k:'stay'});
      if(i===n&&hasB)items.push({t:B.dep||'',title:`${B.from} → ${B.to}`,d:[B.code,B.arr?(S.lang==='th'?'ถึง ':'Arr ')+B.arr:''].filter(Boolean).join(' · '),k:B.mode})}
    items.sort((a,b)=>(tmin(a.t)??1e9)-(tmin(b.t)??1e9));
    days.push({date,title,area,stay,recap:'',notes:[],checks:[],items:items.map(x=>Object.assign({id:uid(),done:false,map:'',cost:''},x))})}
  if(hasO&&outPre(O)){const date=isoAdd(w.start,-1);const s0=st[0];
    days.unshift({date,title:t('wz_go',{a:(s0&&s0.area)||O.to||''}),area:[O.from,O.to].filter(Boolean).join(' → '),stay:'',recap:'',notes:[],checks:[],
      items:w.stops&&O.dep?[Object.assign({id:uid(),done:false,map:'',cost:''},{t:O.dep,title:t('wz_dep_stop',{p:O.from||''}),d:O.code||'',k:O.mode})]:[]})}
  const legs=[];if(hasO)legs.push({id:uid(),mode:O.mode,from:O.from,to:O.to,dep:[dshort(outPre(O)?isoAdd(w.start,-1):w.start),O.dep].filter(Boolean).join(' '),arr:[dshort(w.start),O.arr].filter(Boolean).join(' '),code:O.code,dur:'',booked:false});
  if(hasB)legs.push({id:uid(),mode:B.mode,from:B.from,to:B.to,dep:[dshort(w.end),B.dep].filter(Boolean).join(' '),arr:[dshort(w.end),B.arr].filter(Boolean).join(' '),code:B.code,dur:'',booked:false});
  let c=0;const stays=st.filter(s=>s.stay&&+s.n).map(s=>{const a=isoAdd(w.start,c);c+=+s.n;return {name:s.stay,dates:`${dshort(a)}–${dshort(isoAdd(w.start,c))}`,nights:+s.n,note:s.area,map:s.stay}});
  return {days,legs,stays}}
function wzStrip(w){const n=wzNights(w);if(!n)return '';let used=0;const segs=w.stays.map((s,i)=>{const k=Math.max(0,Math.min(+s.n||0,n-used));used+=k;return k?`<div class="wzseg" style="flex:${k};background:${WZC[i%WZC.length]}"><span>${esc(s.area||'…')}</span></div>`:''}).join('');
  const left=n-used;return `<div class="wzstrip">${segs}${left>0?`<div class="wzseg empty" style="flex:${left}"></div>`:''}</div><div class="wzticks">${Array.from({length:n+1},(_,i)=>`<span>${dshort(isoAdd(w.start,i)).split(' ')[0]}</span>`).join('')}</div>`}
function wzStatus(w){const n=wzNights(w),u=wzUsed(w);if(u===n)return `<div class="wzstat ok">${svg(P.check,'')}${t('wz_ok',{n})}</div>`;return `<div class="wzstat warn"><span>${u<n?t('wz_left',{n:n-u}):t('wz_over',{n:u-n})}</span><button data-wz-fix>${t('wz_fix')}</button></div>`}
function wzLeg(k,L,date){const pre=k==='out'&&outPre(L);return `<div class="wzleg"><div class="wzleg-h"><b>${t(k==='out'?'wz_out':'wz_back')}</b><span>${date?esc(fdate(pre?isoAdd(date,-1):date,true)):''}</span></div>
  ${modeChips(L.mode,`w-${k}-mode`)}
  <div class="grid2"><div><label class="f">${t('from')}</label><input id="w-${k}-from" class="up" value="${esc(L.from)}" placeholder="${k==='out'?'BKK':'KIX'}"></div><div><label class="f">${t('to')}</label><input id="w-${k}-to" class="up" value="${esc(L.to)}" placeholder="${k==='out'?'KIX':'BKK'}"></div></div>
  <div class="grid3"><div><label class="f">${t('wz_dep_t')}</label><input id="w-${k}-dep" class="tm" inputmode="numeric" maxlength="5" value="${esc(L.dep)}" placeholder="08:00"></div><div><label class="f">${t('wz_arr_t')}</label><input id="w-${k}-arr" class="tm" inputmode="numeric" maxlength="5" value="${esc(L.arr)}" placeholder="15:30"></div><div><label class="f">${t('code')}</label><input id="w-${k}-code" class="up" value="${esc(L.code)}" placeholder="TG 622"></div></div>${k==='out'?`<div class="hint" style="margin-top:6px">${pre?t('wz_pre_on'):t('wz_pre_h')}</div>`:''}</div>`}
function wizard(){const w=S.wiz=S.wiz||wzNew();calYM=null;const n=wzNights(w);let body='';
  const qs={1:['wz_q1','wz_s1'],2:['wz_q2','wz_s2'],3:['wz_q3','wz_s3'],4:['wz_q4','wz_s4']}[w.step];

    ${wzLeg('out',w.out,w.start)}${wzLeg('back',w.back,w.end)}`;
  if(w.step===4){const p=wzPlan(w);body=`<label class="sw" style="margin-top:10px"><span class="l">${t('wz_stops')}<small>${t('wz_stops_h')}</small></span><input id="w-stops" type="checkbox" ${w.stops?'checked':''} data-wz-stops><span class="knob"></span></label><div class="wzprev">${p.days.map((d,i)=>`<div class="wzday"><div class="n">${i+1}<small>${esc(fdate(d.date,true).replace(/ \d{4}$/,''))}</small></div><div class="wzdb"><div class="ti">${esc(d.title||d.area||'—')}</div>${d.title&&d.area?`<div class="ar">${esc(d.area)}</div>`:''}${d.stay?`<div class="st">${svg(ICO.stay,'')}${t('stay')} ${esc(d.stay)}</div>`:''}${w.stops&&d.items.length?`<div class="wzits">${d.items.map(it=>`<span>${svg(ICO[it.k]||ICO.see,'')}${esc(it.t?it.t+' ':'')}${esc(it.title)}</span>`).join('')}</div>`:''}</div></div>`).join('')}</div>`}

function wzMake(){const w=S.wiz;const p=wzPlan(w);const tr={id:uid(),name:w.name,dest:w.dest,start:p.days[0].date,end:w.end,members:w.members,planning:false,cover:'',mode:(w.out.from||w.out.to)?w.out.mode:'fly',cur:w.cur,rate:w.cur==='THB'?1:(+w.rate||0),spendPP:0,legs:p.legs,stays:p.stays,checklist:[],ideas:[],days:p.days};

let pendingIdea=null;
function areaToks(a){return String(a||'').split(/\s*(?:→|⇄|·|,|\/)\s*/).map(x=>x.trim()).filter(x=>x&&!/^[A-Z]{3}$/.test(x))}
function tripAreas(tr){const m=new Map();const add=x=>{const k=x.toLowerCase();if(!m.has(k))m.set(k,x)};tr.days.forEach(d=>areaToks(d.area).forEach(add));(tr.ideas||[]).forEach(i=>{if(i.area)add(i.area)});return [...m.values()]}
function sameArea(a,b){return !!a&&!!b&&a.toLowerCase()===b.toLowerCase()}
function areaDays(tr,a){const out=[];tr.days.forEach((d,i)=>{if(areaToks(d.area).some(x=>sameArea(x,a)))out.push(i)});return out}
function dayNums(list){if(!list.length)return '';const r=[];let s=list[0],p=list[0];for(const x of list.slice(1).concat([null])){if(x===p+1){p=x;continue}r.push(s===p?`${s+1}`:`${s+1}–${p+1}`);s=p=x}return `${t('day')} ${r.join(', ')}`}
function ideaSection(tr){const n=(tr.ideas||[]).length;if(!n&&tr.closed)return '';if(!n&&status(tr)!=='planning')return `<div class="ilinkrow" style="gap:16px"><button class="back fibtn" style="margin:0" data-find-ideas>${svg('M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4','')}${t('fi_btn')}</button><button class="back" style="margin:0" data-idea-add>${svg(P.plus,'')}${t('add_idea')}</button></div>`;return `<div class="sec"><h3><span>${t('ideas')}</span>${tr.closed?'':`<span class="hbtns"><button class="back fibtn" style="margin:0" data-find-ideas>${svg('M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4','')}${t('fi_btn')}</button><button class="back" style="margin:0" data-idea-add>${svg(P.plus,'')}${t('add_idea')}</button></span>`}</h3>${ideaSummary(tr)}</div>`}
function ideaSummary(tr){const ideas=tr.ideas||[];if(!ideas.length)return `<button class="ibag emp" data-idea-add><span class="ibico">${svg(P.plus,'')}</span><span>${t('ideas_empty')}</span></button>`;
  const areas=tripAreas(tr).map(a=>[a,ideas.filter(i=>sameArea(i.area,a)).length]).filter(x=>x[1]);const none=ideas.filter(i=>!i.area).length;
  return `<button class="ibag" data-ideas><div class="ibtop"><b>${ideas.length}</b><span>${t('ideas_n',{n:''}).trim()}</span>${svg(P.chev,'')}</div>
    <div class="ibareas">${areas.map(([a,c])=>`<span>${esc(a)} <em>${c}</em></span>`).join('')}${none?`<span class="nb">${t('area_none')} <em>${none}</em></span>`:''}</div>
    <div class="ibpeek">${ideas.slice(0,3).map(i=>`<span>${svg(ICO[i.k]||ICO.see,'')}${esc(i.title)}</span>`).join('')}${ideas.length>3?`<span class="more">+${ideas.length-3}</span>`:''}</div></button>`}
function ideaCard(tr,i){const tags=[];if(i.cost)tags.push(`<span class="tag cost">${fmt(tr,num(i.cost))}</span>`);
  return `<div class="icard" data-idea-edit="${i.id}"><div class="ik">${svg(ICO[i.k]||ICO.see,'')}</div><div class="ib"><div class="ttl">${esc(i.title)}</div>${i.note?`<div class="d">${esc(i.note)}</div>`:''}${tags.length?`<div class="tags">${tags.join('')}</div>`:''}
    <div class="iacts">${i.map?`<a href="${mapURL(i.map)}" target="_blank" rel="noopener">${svg(P.pin,'')} ${t('map_btn')}</a>`:''}<button class="iplace" data-idea-place="${i.id}">${t('place')}${svg(P.chev,'')}</button></div></div></div>`}
function renderIdeas(tr){const el=$('#s-trips');const ideas=tr.ideas||[];const f=S.ideaArea||'';const areas=tripAreas(tr);
  const cnt=a=>a===''?ideas.length:a==='-'?ideas.filter(i=>!i.area).length:ideas.filter(i=>sameArea(i.area,a)).length;
  const groups=(f===''?[...areas,'-']:[f]).map(a=>{const list=a==='-'?ideas.filter(i=>!i.area):ideas.filter(i=>sameArea(i.area,a));if(!list.length)return '';const ds=a==='-'?[]:areaDays(tr,a);
    return `<div class="igrp"><div class="igh"><b>${a==='-'?t('area_none'):esc(a)}</b>${ds.length?`<span>${t('in_plan',{d:dayNums(ds)})}</span>`:''}</div>${list.map(i=>ideaCard(tr,i)).join('')}</div>`}).join('');

function ideaSave(tr,id){const title=$('#i-title').value.trim()||ideaTitleFromURL($('#i-map').value)||$('#i-map').value.trim();if(!title){toast(t('need_name'));return}
  const v={title,map:$('#i-map').value.trim(),area:$('#i-area-new').value.trim()||(($('#i-area .on')?.dataset.k||'-')==='-'?'':$('#i-area .on').dataset.k),k:$('#f-k .on')?.dataset.k||'see',cost:$('#i-cost').value?num($('#i-cost').value):'',note:$('#i-note').value.trim()};
  tr.ideas=tr.ideas||[];if(id)Object.assign(tr.ideas.find(x=>x.id===id),v);else tr.ideas.push(Object.assign({id:uid()},v));save();closeSheet();toast(t('saved'));render()}
function placeSheet(tr,i){const hit=i.area?areaDays(tr,i.area):[];const row=(di,dim)=>{const d=tr.days[di];const n=d.items.length;return `<button class="dayrow prow ${dim?'dim':''}" data-idea-to="${i.id}:${di}"><div class="n">${di+1}<small>${esc(fdate(d.date,true).replace(/ \d{4}$/,''))}</small></div><div><div class="ti">${esc(d.title||d.area||'—')}</div><div class="st">${esc(d.area||'')}${d.area?' · ':''}${n?t('n_stops',{n}):t('no_stops')}</div></div>${svg(P.plus,'')}</button>`};
  const others=tr.days.map((_,di)=>di).filter(di=>!hit.includes(di));
  openSheet(`<h2>${t('place_q')}</h2><div class="pidea">${svg(ICO[i.k]||ICO.see,'')}<b>${esc(i.title)}</b>${i.area?`<span>${esc(i.area)}</span>`:''}</div>
    <label class="f">${t('place_t')}</label><input id="p-t" class="tm" inputmode="numeric" maxlength="5" placeholder="10:00" style="max-width:140px">
    ${hit.length?`<div class="plbl">${t('place_in',{a:i.area})}</div>${hit.map(di=>row(di,false)).join('')}<div class="plbl">${t('place_other')}</div>${others.map(di=>row(di,true)).join('')}`:`<div class="plbl">${t('place_all')}</div>${others.map(di=>row(di,false)).join('')}`}
    <div class="btns"><button class="btn" data-close>${t('cancel')}</button></div>`)}
function ideaTo(tr,id,di){const i=(tr.ideas||[]).find(x=>x.id===id);if(!i)return;const tm=$('#p-t')?$('#p-t').value.trim():'';
  const day=tr.days[di];day.items.push({id:uid(),t:tm,title:i.title,d:i.note||'',k:i.k||'see',map:i.map||'',cost:i.cost||'',done:false});day.items.sort((a,b)=>(tmin(a.t)??1e9)-(tmin(b.t)??1e9));
  tr.ideas=tr.ideas.filter(x=>x.id!==id);save();closeSheet();toast(t('placed',{n:di+1}));render()}
function ideasNear(tr,di){if(tr.closed)return '';const ideas=(tr.ideas||[]);const ar=areaToks(tr.days[di].area);const list=ideas.filter(i=>ar.some(a=>sameArea(a,i.area)));if(!list.length)return '';

document.addEventListener('click',e=>{
  const b=e.target.closest('button,a,[data-idea-edit]');if(!b)return;const d=b.dataset;const tr=S.tripId?trip(S.tripId):null;
  const stop=()=>{e.stopImmediatePropagation();e.preventDefault()};
  if(d.addStop!=null||d.editStop!=null){pendingIdea=null;return}
  if(d.open||d.openday||d.day!=null||d.go||b.hasAttribute('data-tripback')||d.gotoStop!=null)S.ideaView=false;
  if(b.hasAttribute('data-new-trip')){stop();wizard();return}
  if($('#wz')){const w=S.wiz;
    if(d.pick){stop();const st=$('#f-start'),en=$('#f-end');if(!st.value||en.value){st.value=d.pick;en.value=''}else if(d.pick<st.value){st.value=d.pick}else{en.value=d.pick}$('#f-range').innerHTML=rangeLabel(st.value,en.value);w.start=st.value;w.end=en.value;save();renderCal();return}
    if(d.cal!=null||b.hasAttribute('data-range-toggle'))return;
    if(d.wzGo){stop();wzRead();const dir=+d.wzGo;if(dir>0){if(w.step===1&&!w.name){toast(t('need_name'));return}if(w.step===1&&(!w.start||!w.end)){toast(t('wz_need_d'));return}
        if(w.step===1){const n=wzNights(w);if(!wzUsed(w)){w.stays=[{area:w.stays[0].area||(w.dest||'').split(/[·,→]/)[0].trim(),stay:w.stays[0].stay||'',n}]}}
        if(w.step===2&&wzUsed(w)!==wzNights(w)){toast(t('wz_need_n'));return}}
      w.step=Math.max(1,Math.min(4,w.step+dir));save();wizard();$('#sheet').scrollTop=0;return}
    if(d.wzMem){stop();wzRead();w.members=Math.max(1,w.members+ +d.wzMem);save();wizard();return}
    if(d.wzN){stop();wzRead();const [i,v]=d.wzN.split(':').map(Number);w.stays[i].n=Math.max(0,(+w.stays[i].n||0)+v);save();wizard();return}
    if(d.wzRm!=null){stop();wzRead();w.stays.splice(+d.wzRm,1);save();wizard();return}
    if(b.hasAttribute('data-wz-add-stay')){stop();wzRead();const last=w.stays[w.stays.length-1];const add=wzUsed(w)<wzNights(w)?wzNights(w)-wzUsed(w):(last&&last.n>1?1:0);if(!(wzUsed(w)<wzNights(w))&&last&&last.n>1)last.n--;w.stays.push({area:'',stay:'',n:add});save();wizard();return}
    if(b.hasAttribute('data-wz-fix')){stop();wzRead();const diff=wzNights(w)-wzUsed(w);for(let i=w.stays.length-1;i>=0&&diff;i--){const s=w.stays[i];s.n=Math.max(0,(+s.n||0)+diff);break}save();wizard();return}
    if(d.wzCur){stop();wzRead();w.cur=d.wzCur;save();wizard();return}
    if(b.hasAttribute('data-wz-make')){stop();wzRead();wzMake();return}
    if(b.hasAttribute('data-wz-manual')){stop();wzRead();tripForm(null);return}
    if(b.hasAttribute('data-wz-reset')){stop();S.wiz=wzNew();save();wizard();return}
    if(b.hasAttribute('data-close')){wzRead();return}
  }
  if(!tr)return;
  if(b.hasAttribute('data-ideas')){stop();S.ideaView=true;S.ideaArea='';save();renderTrips();window.scrollTo(0,0);return}
  if(b.hasAttribute('data-idea-back')){stop();S.ideaView=false;save();renderTrips();return}
  if(d.ideaFilter!=null){stop();S.ideaArea=d.ideaFilter;save();renderTrips();return}
  if(b.hasAttribute('data-idea-add')){stop();ideaForm(tr,null);return}
  if(d.ideaSave!=null){stop();ideaSave(tr,d.ideaSave);return}
  if(d.ideaDel){stop();if(!confirm(t('confirm_del')))return;tr.ideas=tr.ideas.filter(x=>x.id!==d.ideaDel);save();closeSheet();toast(t('deleted'));render();return}
  if(d.ideaPlace){stop();placeSheet(tr,tr.ideas.find(x=>x.id===d.ideaPlace));return}
  if(d.ideaTo){stop();const [id,di]=d.ideaTo.split(':');ideaTo(tr,id,+di);return}
  if(d.ideaQuick){stop();const [id,di]=d.ideaQuick.split(':');const i=tr.ideas.find(x=>x.id===id);stopForm(tr,+di,null);pendingIdea=id;$('#f-title').value=i.title;$('#f-map').value=i.map||'';if(i.cost)$('#f-cost').value=nf(num(i.cost));const s=$('#f-steps .stin');if(s&&i.note)s.value=i.note;$('#f-k').outerHTML=kindChips(i.k||'see',false);return}
  if(d.ideaEdit&&!e.target.closest('a,button')){stop();ideaForm(tr,tr.ideas.find(x=>x.id===d.ideaEdit));return}
},true);

function ifmt(tr,e,v){return `${nf(v)} ${eCur(tr,e)}`}
function eCur(tr,e){return e&&e.cur==='THB'?'THB':(tr.cur||'THB')}
function eTHB(tr,e,v){return eCur(tr,e)==='THB'?v:toTHB(tr,v)}
function ePair(tr,e){const m=e.each?(tr.members||1):1;const est=num(e.cost)||0,act=num(e.actual)||0;
  return {est:eTHB(tr,e,est)*m,paid:eTHB(tr,e,act)*m,use:(act?eTHB(tr,e,act):eTHB(tr,e,est))*m,has:!!(est||act)}}
function cGroups(tr){const mk=(k,items)=>{const g={k,est:0,paid:0,use:0,items:[]};items.forEach(x=>{const p=ePair(tr,x.e);if(!p.has)return;g.est+=p.est;g.paid+=p.paid;g.use+=p.use;g.items.push(Object.assign({p},x))});return g};
  const stops=[];(tr.days||[]).forEach((d,di)=>(d.items||[]).forEach(it=>{if(!it.skipped)stops.push({e:it,label:it.title,sub:`${t('c_day',{n:di+1})}${it.t?' · '+it.t:''}`,go:`stop:${di}:${it.id}`})}));
  return [mk('c_travel',(tr.legs||[]).map(l=>({e:l,label:`${l.from||''} → ${l.to||''}`,sub:[l.code,l.dep].filter(Boolean).join(' · '),go:`leg:${l.id}`}))),
    mk('c_stay',(tr.stays||[]).map((s,i)=>({e:s,label:s.name,sub:[s.dates,s.nights?`${s.nights} ${S.lang==='th'?'คืน':'nights'}`:''].filter(Boolean).join(' · '),go:`stay:${i}`}))),
    mk('c_stops',stops),
    mk('c_extra',(tr.extras||[]).map(x=>({e:x,label:x.title,sub:x.note||'',go:`extra:${x.id}`})))]}
function cTotal(tr){const g=cGroups(tr);const T={est:0,paid:0,use:0,groups:g};g.forEach(x=>{T.est+=x.est;T.paid+=x.paid;T.use+=x.use});T.pp=T.use/(tr.members||1);return T}
function thb(v){return `${nf(v)} THB`}
const CICO={c_travel:'fly',c_stay:'stay',c_stops:'see',c_extra:'shop'};
function costSection(tr){const T=cTotal(tr);const any=T.use>0;
  const head=`<h3><span>${t('costs')}</span>${tr.closed?'':`<button class="back" style="margin:0" data-cost-add>${svg(P.plus,'')}${t('add_extra')}</button>`}</h3>`;
  if(!any)return `<div class="sec">${head}<button class="costcard emp" data-cost-add><span class="ibico">${svg(P.plus,'')}</span><span>${t('c_none')}</span></button></div>`;
  const cols=['var(--accent)','var(--pine)','var(--gold)','var(--accent-2)'];
  return `<div class="sec">${head}<button class="costcard" data-costs>
    <div class="ctop"><div class="cnum"><b>${nf(T.use)}</b><span>THB · ${t('c_est')}</span></div><div class="cpp">${t('c_pp',{v:nf(T.pp)})}</div>${svg(P.chev,'')}</div>
    <div class="cbar">${T.groups.map((g,i)=>g.use?`<i style="flex:${g.use};background:${cols[i]}"></i>`:'').join('')}</div>
    <div class="crows">${T.groups.map((g,i)=>`<div class="crow"><i class="cdot" style="background:${cols[i]}"></i><span class="cl">${t(g.k)}</span><b>${g.use?nf(g.use):'—'}</b></div>`).join('')}</div>
    ${T.paid?`<div class="cpaid"><div class="cpbar"><i style="width:${Math.min(100,T.paid/T.use*100)}%"></i></div><span>${t('c_of',{a:nf(T.paid),b:nf(T.use)})}</span></div>`:''}
  </button></div>`}
function cVal(tr,v){return S.costPP===false?v:v/(tr.members||1)}
function cPaid(x){return !!num(x.e.actual)}
function renderCosts(tr){const T=cTotal(tr);const el=$('#s-trips');const pp=S.costPP!==false;const f=S.costF||'all';
  const keep=x=>f==='all'||(f==='paid'?cPaid(x):!cPaid(x));
  const gs=T.groups.map(g=>{const items=g.items.filter(keep);return {k:g.k,items,use:items.reduce((a,x)=>a+x.p.use,0)}});
  const shown=gs.reduce((a,g)=>a+g.use,0),unpaid=T.use-T.paid;
  el.innerHTML=`<div class="head"><button class="back" style="margin:0" data-cost-back>${svg(P.back,'')}${esc(tr.name)}</button>${tr.closed?'':`<button class="ibtn" data-cost-add aria-label="add">${svg(P.plus,'')}</button>`}</div>
   <div class="chead"><h1 class="ih1">${t('costs')}</h1><div class="ctot"><b>${nf(cVal(tr,f==='all'?T.use:shown))}</b><span>THB · ${pp?t('per_p'):t('c_tot')}${status(tr)==='planning'&&f!=='paid'?` · ${t('c_est')}`:''}</span></div></div>
   ${T.paid?`<div class="cpd">${t('c_pu',{a:nf(cVal(tr,T.paid)),b:nf(cVal(tr,unpaid))})}</div>`:''}
   ${(tr.cur||'THB')!=='THB'?`<button class="crate" data-edit-trip="${tr.id}">${t('c_rate',{c:tr.cur,v:tr.rate||0})}<span>${t('edit')}</span></button>`:''}
   <div class="csegbox"><div class="row"><button class="${pp?'on':''}" data-cost-pp="1">${t('per_p')}</button><button class="${pp?'':'on'}" data-cost-pp="0">${t('c_tot')}</button></div>
   <div class="row"><button class="${f==='all'?'on':''}" data-cost-f="all">${t('all_x')}</button><button class="${f==='paid'?'on':''}" data-cost-f="paid">${t('f_paid')}</button><button class="${f==='unpaid'?'on':''}" data-cost-f="unpaid">${t('f_unpaid')}</button></div></div>
   ${tr.closed?'':`<button class="stadd" style="margin:2px 0 10px" data-cost-add>${svg(P.plus,'')}<span>${t('add_extra')}</span></button>`}
   ${gs.map(g=>`<div class="igrp"><div class="igh"><b>${t(g.k)}</b><span>${g.use?`${nf(cVal(tr,g.use))} THB`:t('c_none_g')}</span></div>
     ${!g.items.length?'':g.items.map(x=>{const pd=cPaid(x);return `<button class="ecard ${pd?'pd':'un'}" data-cost-go="${x.go}"><div class="eb"><div class="ttl">${esc(x.label||'—')}</div>${x.sub?`<div class="d">${esc(x.sub)}</div>`:''}</div><div class="ev"><b>${pd?svg(P.check,''):''}${nf(cVal(tr,x.p.use))}</b><span>${(()=>{const c=eCur(tr,x.e),v=num(x.e.actual)||num(x.e.cost)||0,parts=[];if(c!=='THB')parts.push(`${c} ${nf(v)}`);if(x.e.each)parts.push(S.lang==='th'?'ต่อคน':'per person');parts.push(pd?t('c_paid'):t('c_est'));return parts.join(' · ')})()}</span></div></button>`}).join('')}
   </div>`).join('')}<div class="hint ppnote">${t('c_pie')}</div>`}
function mBox(tr,e,p){const cc=eCur(tr,e),alt=(tr.cur||'THB')!=='THB';
  return `<div class="grid2"><div><label class="f">${t('cost_est')}</label><div class="money"><input id="f-${p}cost" class="amt" type="text" inputmode="decimal" value="${e.cost?nf(num(e.cost)):''}" placeholder="1,000.00"><span class="cur" data-curlbl="${p}">${cc}</span></div></div>
    <div><label class="f">${t('cost_act')}</label><div class="money"><input id="f-${p}act" class="amt" type="text" inputmode="decimal" value="${e.actual?nf(num(e.actual)):''}" placeholder="${t('c_paid')}"><span class="cur" data-curlbl="${p}">${cc}</span></div></div></div>
    <div class="csegbox mbox one"><div class="row" id="f-${p}who"><button class="${e.each?'on':''}" data-k="each">${t('per_p')}</button><button class="${e.each?'':'on'}" data-k="all">${t('per_g')}</button></div>
    ${alt?`<div class="row" id="f-${p}cur"><button class="${cc==='THB'?'on':''}" data-k="THB">THB</button><button class="${cc!=='THB'?'on':''}" data-k="trip">${tr.cur}</button></div>`:''}</div>`}
function mRead(tr,p){const g=id=>$(id)?$(id).value:'';const cur=$(`#f-${p}cur .on`)?.dataset.k;
  return {cost:g(`#f-${p}cost`)?num(g(`#f-${p}cost`)):'',actual:g(`#f-${p}act`)?num(g(`#f-${p}act`)):'',each:$(`#f-${p}who .on`)?.dataset.k==='each',cur:cur==='THB'?'THB':'trip'}}
function stayForm(tr,i){const isNew=i==null;const s=isNew?{name:'',dates:'',nights:'',note:'',map:'',cost:'',actual:'',each:false,cur:'trip'}:tr.stays[i];
  openSheet(`<h2>${isNew?t('add_stay'):t('edit_stay')}</h2>
    <label class="f">${t('stay_name')}</label><input id="f-sname" value="${esc(s.name||'')}" placeholder="Wakata Lodge Hakuba">
    <div class="grid2"><div><label class="f">${t('stay_dates')}</label><input id="f-sdates" value="${esc(s.dates||'')}" placeholder="17–19 ต.ค."></div><div><label class="f">${t('nights_n')}</label><input id="f-snights" type="number" inputmode="numeric" value="${s.nights||''}" placeholder="2"></div></div>
    ${mBox(tr,s,'s')}
    <label class="f">${t('note')}</label><textarea id="f-snote" rows="2">${esc(s.note||'')}</textarea>
    <label class="f">${t('map')}</label><input id="f-smap" value="${esc(s.map||'')}">
    <div class="btns">${isNew?'':`<button class="btn del" data-del-stay="${i}">${t('delete')}</button>`}<button class="btn" data-close>${t('cancel')}</button><button class="btn pri" data-save-stay="${isNew?'':i}">${t('save')}</button></div>`)}
function extraForm(tr,id){const isNew=!id;const e=isNew?{title:'',note:'',cost:'',actual:'',each:false,cur:'THB'}:(tr.extras||[]).find(x=>x.id===id);

    if(!v.name){toast(t('need_name'));return}tr.stays=tr.stays||[];if(d.saveStay==='')tr.stays.push(v);else Object.assign(tr.stays[+d.saveStay],v);save();closeSheet();toast(t('saved'));render();return}
  if(d.delStay!=null){stop();if(!confirm(t('confirm_del')))return;tr.stays.splice(+d.delStay,1);save();closeSheet();toast(t('deleted'));render();return}
  if(d.costGo){stop();const [kind,a,b2]=d.costGo.split(':');
    if(kind==='leg')legForm(tr,(tr.legs||[]).find(x=>x.id===a));

    return}
},true);

function autoDay(d){const its=((d&&d.items)||[]).filter(x=>!x.skipped);if(!its.length)return '';const th=S.lang==='th';
  const TR={fly:1,train:1,bus:1,car:1,ferry:1,stay:1},FD={food:1,cafe:1};const tm=its.map(x=>tmin(x.t));
  const dur=its.map((x,i)=>{const a=tm[i];if(a==null)return 30;let b=null;for(let j=i+1;j<its.length;j++)if(tm[j]!=null&&tm[j]>a){b=tm[j];break}return b==null?60:Math.min(b-a,600)});
  const all=its.map((x,i)=>({x,i,dur:dur[i]}));const act=all.filter(o=>!TR[o.x.k]);const nTr=all.length-act.length;const areas=areaToks(d.area);
  const short=v=>{v=String(v||'').split(/\s+[—–-]\s+|\s*[·|(（]\s*|[:：]\s/)[0].trim();return v.length>26?v.slice(0,25).trim()+'…':v};
  if(!act.length||(nTr>=act.length*2&&areas.length>1))return areas.length>1?areas.join(' → '):(th?'วันเดินทาง':'Travel day');
  const cnt=(...k)=>act.filter(o=>k.includes(o.x.k)).length,n=act.length;
  if(cnt('shop')>=2&&cnt('shop')>=n/2)return th?'วันช้อปปิ้ง':'Shopping day';
  if(cnt('food','cafe')>=3&&cnt('food','cafe')>=n*0.6)return th?'วันตะลุยกิน':'Food day';
  const main=act.filter(o=>!FD[o.x.k]);const pool=main.length?main:act;
  if(cnt('hike')&&main.every(o=>['hike','lift','walk','photo'].includes(o.x.k))&&main.length>2){const h=main.find(o=>o.x.k==='hike');return short(h.x.title)}
  const big=pool.slice().sort((a,b)=>b.dur-a.dur)[0];if(big.dur>=240&&big.dur>=pool.reduce((s,o)=>s+o.dur,0)*0.5)return short(big.x.title);
  return pool.slice().sort((a,b)=>b.dur-a.dur||a.i-b.i).slice(0,2).sort((a,b)=>a.i-b.i).map(o=>short(o.x.title)).join(' · ')}
function dName(d){return (d&&d.title)||autoDay(d)}

  const sp=/\s+[—–-]\s+|\s*[:：|]\s+/.exec(rest);if(sp&&sp.index>0){stop.title=tpClean(rest.slice(0,sp.index));const d=rest.slice(sp.index+sp[0].length).trim();if(d)stop.steps.unshift(d)}else stop.title=tpClean(rest)}
let tpCtx=null;
function tpBase(c){if(c.mode==='merge'){const tr=trip(c.tid);return (tr.days[c.from]||tr.days[0]||{}).date||c.start}return c.start}
function tpLayout(c){const p=c.p;const base=tpBase(c);let prev='';return p.days.map((d,i)=>{let date=d.date;if(!date)date=prev?isoAdd(prev,1):(base?isoAdd(base,i):'');prev=date;let idx=-1;if(c.mode==='merge'&&date){idx=trip(c.tid).days.findIndex(x=>x.date===date)}return {date,idx}})}
function tpOpen(mode,tid){tpCtx=tpCtx&&tpCtx.mode===mode&&tpCtx.tid===tid?tpCtx:{mode,tid,text:'',from:0,start:'',name:''};const c=tpCtx;if(!c.text&&S.tpDraft&&S.tpDraft.mode===mode&&(S.tpDraft.tid||null)===(tid||null))c.text=S.tpDraft.text||'';
  openSheet(`<div id="tp"><h2>${t('tp_t')}</h2>${mode==='merge'?`<div class="tpinto">${t('tp_into',{n:`<b>${esc(trip(tid).name)}</b>`})}</div>`:''}<div class="hint" style="margin:2px 0 8px">${t('tp_h')}</div>
    <textarea id="tp-text" class="tpin" placeholder="${esc(t('tp_ph'))}">${esc(c.text)}</textarea>
    <div class="tpai"><p>${t('tp_ai')}</p><button type="button" data-tp-copy>${svg('M8 8h11v12H8zM5 16V4h11','')}${t('tp_copy')}</button></div>
    <div class="btns">${mode==='new'?`<button class="btn" data-tp-wz>${t('wz_prev')}</button>`:`<button class="btn" data-close>${t('cancel')}</button>`}<button class="btn pri" data-tp-read>${t('tp_read')}</button></div></div>`)}
function tpPreview(){const c=tpCtx;const p=c.p;const lay=tpLayout(c);const nS=p.days.reduce((a,d)=>a+d.items.length,0);const hasDate=p.days.some(d=>d.date);const tr=c.mode==='merge'?trip(c.tid):null;
  const tag=(cls,x)=>`<span class="tag ${cls}">${esc(x)}</span>`;
  const days=p.days.map((d,di)=>{const L=lay[di];const head=c.mode==='merge'?(L.idx>=0?`<b>${t('day')} ${L.idx+1}</b>`:`<span class="nw">${t('tp_new_day')}</span>`):`<b>${t('day')} ${di+1}</b>`;
    return `<div class="tpday"><div class="tpdh">${head}<span>${L.date?esc(fdate(L.date,true)):''}</span></div>${d.title?`<div class="tpdt">${esc(d.title)}</div>`:''}${d.area||d.stay?`<div class="tpmeta">${d.area?`<span>${svg(P.pin,'')}${esc(d.area)}</span>`:''}${d.stay?`<span>${svg(ICO.stay,'')}${t('stay')} ${esc(d.stay)}</span>`:''}</div>`:''}
      ${d.items.length?d.items.map((it,ii)=>`<div class="tpit"><span class="tm">${esc(it.t)}</span>${svg(ICO[it.k]||ICO.see)}<div><b>${esc(it.title)}</b>${it.d?`<small>${esc(dLine(it.d))}</small>`:''}${it.cost||it.ref||it.res||it.map?`<div class="tags">${it.cost?tag('cost','~'+nf(it.cost.v)+' '+(it.cost.cur||(tr?sym(tr):tpCur(p)))):''}${it.ref?tag('ref',it.ref):''}${it.res?tag('res',it.res):''}${it.map?tag('',(S.lang==='th'?'แผนที่':'Map')):''}</div>`:''}</div><button type="button" class="tpx" data-tp-x="${di}:${ii}" aria-label="remove">${svg(P.x,'')}</button></div>`).join(''):`<div class="empty">${t('tp_noit')}</div>`}</div>`}).join('');
  openSheet(`<div id="tp"><h2>${t('tp_check')}</h2><div class="tpsum">${svg(P.check,'')}${t('tp_sum',{d:p.days.length,s:nS})}</div>
    ${c.mode==='new'?`<label class="f">${t('name')}</label><input id="tp-name" value="${esc(c.name)}" placeholder="Kansai Sakura">
      ${hasDate?`<label class="f">${t('dates')}</label><div class="tpdates">${esc(frange(lay[0].date,lay.map(l=>l.date).sort().pop()))}<small>${t('tp_by_date')}</small></div>`:`<label class="f">${t('tp_start')}</label><input id="tp-start" type="date" value="${esc(c.start)}"><div class="hint" style="margin-top:3px">${t('tp_start_h')}</div>`}
      ${tpCur(p)!=='THB'?`<label class="f">${t('rate')}</label><input id="tp-rate" type="number" inputmode="decimal" step="0.0001" value="${esc(c.rate||'')}" placeholder="0.23"><div class="hint" style="margin-top:3px">${t('wz_rate_h',{c:tpCur(p)})}</div>`:''}`
    :`<div class="tpinto">${t('tp_into',{n:`<b>${esc(tr.name)}</b>`})}</div>${hasDate?`<div class="hint">${t('tp_by_date')}</div>`:`<label class="f">${t('tp_from')}</label><select id="tp-from">${tr.days.map((d,i)=>`<option value="${i}" ${i===c.from?'selected':''}>${t('day')} ${i+1} · ${esc(fdate(d.date,true))}</option>`).join('')}</select>`}<div class="hint" style="margin-top:3px">${t('tp_merge_h')}</div>`}
    <div class="hint" style="margin-top:8px">${t('tp_x_h')}</div>${days}
    ${p.skip.length?`<details class="tpskip"><summary>${t('tp_skip',{n:p.skip.length})}</summary><div>${esc(p.skip.join('\n'))}</div></details>`:''}
    <div class="btns"><button class="btn" data-tp-back>${t('tp_back')}</button><button class="btn pri" data-tp-go>${t('tp_go')}</button></div></div>`)}
function tpCur(p){const n={};p.days.forEach(d=>d.items.forEach(it=>{const c=it.cost&&it.cost.cur;if(c&&c!=='THB')n[c]=(n[c]||0)+1}));const k=Object.keys(n).sort((a,b)=>n[b]-n[a])[0];return k||'THB'}
function tpRead(){const c=tpCtx;if(!c)return;const g=id=>$(id);if(g('#tp-text'))c.text=g('#tp-text').value;if(g('#tp-name'))c.name=g('#tp-name').value.trim();if(g('#tp-start'))c.start=g('#tp-start').value;if(g('#tp-rate'))c.rate=g('#tp-rate').value;if(g('#tp-from'))c.from=+g('#tp-from').value}
function tpItem(it,cur){const o={id:uid(),done:false,t:it.t,title:it.title,d:it.d,k:it.k,map:it.map||'',cost:'',ref:it.ref||'',res:it.res||''};if(it.cost){o.cost=it.cost.v;o.cur=(it.cost.cur==='THB'&&cur!=='THB')?'THB':'trip'}return o}
function tpLink(tr,items){items.forEach(it=>{if(it.ref||it.res){const ch={id:uid(),title:it.title,note:it.res||'',done:false};tr.checklist=tr.checklist||[];tr.checklist.push(ch);it.bk=ch.id}});syncBk(tr)}
function tpApply(){const c=tpCtx,p=c.p;const lay=tpLayout(c);const all=[];const nS=p.days.reduce((a,d)=>a+d.items.length,0);
  const byT=(a,b)=>(tmin(a.t)??1e9)-(tmin(b.t)??1e9);
  if(c.mode==='new'){if(!c.name){toast(t('need_name'));return}if(lay.some(l=>!l.date)){toast(t('tp_need_d'));return}
    const cur=tpCur(p);const map=new Map();p.days.forEach((d,i)=>{const date=lay[i].date;let x=map.get(date);if(!x){x={date,title:'',area:'',stay:'',recap:'',notes:[],checks:[],items:[]};map.set(date,x)}
      x.title=x.title||d.title||d.area;x.area=x.area||d.area;x.stay=x.stay||d.stay;x.recap=[x.recap,d.recap].filter(Boolean).join(' ');const its=d.items.map(it=>tpItem(it,cur));x.items.push(...its);all.push(...its)});
    const days=[...map.values()].sort((a,b)=>a.date<b.date?-1:1);days.forEach(d=>d.items.sort(byT));
    const areas=[...new Set(days.map(d=>d.area).filter(Boolean))].slice(0,3).join(' · ');
    const tr={id:uid(),name:c.name,dest:areas,start:days[0].date,end:days[days.length-1].date,members:2,planning:false,cover:'',mode:'fly',cur,rate:cur==='THB'?1:(+c.rate||0),spendPP:0,legs:[],stays:[],checklist:[],ideas:[],days};
    tpLink(tr,all);S.trips.push(tr);S.wiz=null;S.tripId=tr.id;S.dayView=null;S.ideaView=false;S.costView=false}
  else{const tr=trip(c.tid);let first=null;
    p.days.forEach((d,i)=>{const date=lay[i].date;let x=tr.days.find(y=>y.date===date);if(!x){x={date,title:'',area:'',stay:'',recap:'',notes:[],checks:[],items:[]};tr.days.push(x)}
      if(!x.title)x.title=d.title||'';if(!x.area)x.area=d.area;if(!x.stay)x.stay=d.stay;if(!x.recap)x.recap=d.recap;const its=d.items.map(it=>tpItem(it,tr.cur||'THB'));x.items.push(...its);x.items.sort(byT);all.push(...its);if(first==null)first=date});
    tr.days.sort((a,b)=>a.date<b.date?-1:1);tr.start=tr.days[0].date;tr.end=tr.days[tr.days.length-1].date;tpLink(tr,all);const fi=tr.days.findIndex(y=>y.date===first);S.dayView=fi>=0?fi:null}
  tpCtx=null;delete S.tpDraft;save();closeSheet();go('trips');toast(t('tp_done',{d:p.days.length,s:nS}))}
function tpPrompt(){return S.lang==='th'?`ช่วยจัดแผนเที่ยวด้านล่างให้อยู่ในรูปแบบนี้ เพื่อนำเข้าแอป Crumb — ตอบเป็นข้อความธรรมดา ไม่ใช้ตาราง ไม่ใช้ตัวหนา

ชื่อทริป: ...
วันที่ 1 · 17 ต.ค. 2026 · ชื่อของวันนั้น
พื้นที่: เมืองหรือย่าน
ที่พัก: ชื่อที่พักคืนนั้น
07:30 ชื่อสถานที่ — รายละเอียดสั้น ๆ

09:00 จุดถัดไป — ...

- ทุกจุดแวะขึ้นต้นบรรทัดด้วยเวลาแบบ 24 ชม. (HH:MM) เรียงตามเวลา
- ใช้รหัสสกุลเงิน เช่น JPY, THB
- บรรทัด ค่าใช้จ่าย / เลขจอง / จอง / แผนที่ ใส่เฉพาะที่มีข้อมูล
- ขั้นตอนให้ขึ้นต้นด้วย "- " ใต้จุดแวะนั้น

แผนเที่ยวหรือความต้องการของฉัน:
`:`Please rewrite the trip plan below in this exact format so I can import it into the Crumb app — plain text only, no tables, no bold.

Rules
- Every stop starts with a 24-hour time (HH:MM), in time order
- Use currency codes such as JPY, THB
- Only include Cost / Booking ref / Booking / Map lines when there is information
- Steps start with "- " under their stop

My plan or what I want:
`}
function tpCopy(){const p=tpPrompt();const ok=()=>toast(t('tp_copied'));const fb=()=>{const a=document.createElement('textarea');a.value=p;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(a);a.select();a.setSelectionRange(0,p.length);try{document.execCommand('copy');ok()}catch(_){}a.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(p).then(ok,fb);else fb()}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-tp-new],[data-tp-add],#tp button');if(!b)return;const d=b.dataset;const stop=()=>{e.stopImmediatePropagation();e.preventDefault()};
  if(b.hasAttribute('data-tp-new')){stop();if(typeof wzRead==='function')wzRead();const w=S.wiz;tpOpen('new',null);if(w&&tpCtx){if(!tpCtx.name)tpCtx.name=w.name||'';if(!tpCtx.start)tpCtx.start=w.start||''}return}
  if(b.hasAttribute('data-tp-add')){stop();tpOpen('merge',S.tripId);return}
  if(!$('#tp'))return;
  if(b.hasAttribute('data-close')){stop();tpRead();closeSheet();return}
  if(b.hasAttribute('data-tp-wz')){stop();tpRead();wizard();return}
  if(b.hasAttribute('data-tp-copy')){stop();tpCopy();return}
  if(b.hasAttribute('data-tp-read')){stop();tpRead();const c=tpCtx;if(!c.text.trim()){toast(t('tp_empty'));return}const ry=c.mode==='merge'?+(trip(c.tid).start||'').slice(0,4)||null:(c.start?+c.start.slice(0,4):null);c.p=tpParse(c.text,ry);
    if(!c.p.days.length||!c.p.days.some(d=>d.items.length)){toast(t('tp_none'));return}if(c.mode==='new'&&!c.name)c.name=c.p.title||'';tpPreview();return}
  if(b.hasAttribute('data-tp-back')){stop();tpRead();tpOpen(tpCtx.mode,tpCtx.tid);return}
  if(d.tpX){stop();tpRead();const [di,ii]=d.tpX.split(':').map(Number);const sc=$('#sheet').scrollTop;tpCtx.p.days[di].items.splice(ii,1);tpPreview();$('#sheet').scrollTop=sc;return}
  if(b.hasAttribute('data-tp-go')){stop();tpRead();tpApply();return}
},true);
document.addEventListener('change',e=>{if(!tpCtx||!$('#tp'))return;if(e.target.id==='tp-start'||e.target.id==='tp-from'){tpRead();const sc=$('#sheet').scrollTop;tpPreview();$('#sheet').scrollTop=sc}});
setInterval(()=>{if(mvDrag)return;if(S.view==='home'||(S.view==='trips'&&S.dayView!=null))render()},30000);
if(S._bkSync){const _t=trip(S._bkSync);if(_t)syncBk(_t);delete S._bkSync;save()}
fixRange();
applyTheme();
document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
$('#s-start').classList.add('on');document.body.classList.add('starting');
go(S.view||'home');
try{lvStartAll();lvHash()}catch(e){console.warn(e)}
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{reg.addEventListener('updatefound',()=>{const nw=reg.installing;nw&&nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)nw.postMessage({type:'SKIP_WAITING'})})})}).catch(()=>{});
  let refreshed=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(refreshed)return;refreshed=true;location.reload()});
}
